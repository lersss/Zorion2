<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Доска заданий</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f0f4fa; padding: 2rem; min-height: 100vh; }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 1rem; margin-bottom: 1rem; border: 1px solid #334155; }
        .card h3 { color: #60a5fa; margin-bottom: 0.5rem; }
        .card p { color: #cbd5e1; margin-bottom: 0.3rem; }
        .card .meta { font-size: 0.85rem; color: #94a3b8; }
        .btn { background: #3b82f6; border: none; color: white; padding: 0.5rem 1.2rem; border-radius: 2rem; cursor: pointer; font-size: 0.9rem; transition: background 0.2s; }
        .btn:hover { background: #2563eb; }
        .btn-back { background: #475569; }
        .btn-back:hover { background: #334155; }
        .loading { color: #94a3b8; }
        .error { color: #f87171; }
        .empty { color: #94a3b8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Доска заданий</h1>
        <div id="assignmentsList" class="loading">Загрузка...</div>
        <br>
        <button class="btn btn-back" onclick="location.href='/'">← Назад</button>
    </div>

    <script>
        const token = localStorage.getItem('token');
        if (!token) {
            if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
        } else {
            loadAssignments();
        }

        async function loadAssignments() {
            const container = document.getElementById('assignmentsList');
            try {
                // 1. Получаем текущий мир пользователя
                const meRes = await fetch('/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (meRes.status === 401 || meRes.status === 403) {
                    if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                    return;
                }
                if (!meRes.ok) throw new Error('Не удалось получить данные пользователя');
                const userData = await meRes.json();
                if (!userData.current_world_id) {
                    container.innerHTML = '<div class="empty">🌌 У вас нет текущего мира. Переместитесь в какой-нибудь мир.</div>';
                    return;
                }

                // 2. Загружаем контракты текущего мира через API
                const contractsRes = await fetch('/api/contracts', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (contractsRes.status === 401 || contractsRes.status === 403) {
                    if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                    return;
                }
                if (!contractsRes.ok) throw new Error('Ошибка загрузки контрактов');
                const contracts = await contractsRes.json();

                if (contracts.length === 0) {
                    container.innerHTML = '<div class="empty">📭 Нет доступных контрактов в этом мире.</div>';
                    return;
                }

                let html = '';
                contracts.forEach(c => {
                    const expires = new Date(c.expires_at).toLocaleString();
                    const typeMap = { tech: 'Технологичный', agri: 'Аграрный', military: 'Военный', trade: 'Торговый', mixed: 'Смешанный', test: 'Тестовый' };
                    html += `
                        <div class="card">
                            <h3>${c.title}</h3>
                            <p>${c.description}</p>
                            <p class="meta"><strong>Тип:</strong> ${typeMap[c.type] || c.type}</p>
                            <p class="meta"><strong>Автор:</strong> ${c.author_type} (${c.author_id.substring(0, 8)}...)</p>
                            <p class="meta"><strong>Награда:</strong> ${c.reward} кредитов</p>
                            <p class="meta"><strong>Истекает:</strong> ${expires}</p>
                            <br>
                            <button class="btn" onclick="takeContract('${c.id}')">Взять</button>
                        </div>
                    `;
                });
                container.innerHTML = html;

            } catch (err) {
                container.innerHTML = `<div class="error">❌ Ошибка загрузки: ${err.message}</div>`;
                console.error(err);
            }
        }

        async function takeContract(id) {
            try {
                const res = await fetch('/api/contracts/take', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ contract_id: id })
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                        return;
                    }
                    const text = await res.text();
                    alert('Ошибка: ' + text);
                    return;
                }
                alert('Контракт взят!');
                loadAssignments(); // обновляем список
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }
    </script>
</body>
</html>
