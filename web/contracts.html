<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Контракты</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0f172a;
            color: #f0f4fa;
            font-family: system-ui, sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }
        .container { max-width: 1000px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 1rem; }
        .filters {
            background: #1e293b;
            padding: 1rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.8rem;
            align-items: end;
        }
        .filters label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.2rem; }
        .filters input, .filters select {
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f0f4fa;
            width: 150px;
        }
        .filters button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0.4rem 1rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .filters button:hover { background: #2563eb; }
        .contracts-list { display: flex; flex-direction: column; gap: 1rem; }
        .contract-card {
            background: #1e293b;
            padding: 1.2rem;
            border-radius: 1rem;
            border: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }
        .contract-info { flex: 1; min-width: 200px; }
        .contract-info h3 { color: #60a5fa; margin-bottom: 0.3rem; }
        .contract-info p { color: #cbd5e1; font-size: 0.9rem; margin-bottom: 0.2rem; }
        .contract-meta { font-size: 0.8rem; color: #94a3b8; display: flex; gap: 1rem; flex-wrap: wrap; }
        .contract-actions { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
        .contract-actions button {
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
            font-size: 0.85rem;
        }
        .btn-take { background: #22c55e; color: white; }
        .btn-take:hover { background: #16a34a; }
        .btn-complete { background: #eab308; color: white; }
        .btn-complete:hover { background: #ca8a04; }
        .btn-disabled { background: #475569; color: #94a3b8; cursor: not-allowed; }
        .status-badge {
            font-size: 0.7rem;
            padding: 0.2rem 0.6rem;
            border-radius: 1rem;
            background: #334155;
            color: #94a3b8;
        }
        .status-open { background: #22c55e; color: white; }
        .status-taken { background: #eab308; color: white; }
        .status-completed { background: #3b82f6; color: white; }
        .status-expired { background: #ef4444; color: white; }
        .create-form {
            background: #1e293b;
            padding: 1.2rem;
            border-radius: 1rem;
            margin-bottom: 1.5rem;
            border: 1px solid #334155;
        }
        .create-form h3 { margin-bottom: 0.5rem; }
        .create-form .row { display: flex; flex-wrap: wrap; gap: 0.8rem; margin-bottom: 0.5rem; }
        .create-form label { font-size: 0.85rem; color: #94a3b8; display: block; margin-bottom: 0.2rem; }
        .create-form input, .create-form select {
            padding: 0.4rem 0.6rem;
            border-radius: 0.4rem;
            border: 1px solid #334155;
            background: #0f172a;
            color: #f0f4fa;
            width: 180px;
        }
        .create-form button {
            background: #3b82f6;
            border: none;
            color: white;
            padding: 0.4rem 1.2rem;
            border-radius: 2rem;
            cursor: pointer;
            transition: 0.2s;
        }
        .create-form button:hover { background: #2563eb; }
        .back-link { display: inline-block; margin-bottom: 1rem; color: #60a5fa; text-decoration: none; }
        .back-link:hover { text-decoration: underline; }
        .empty-message { color: #94a3b8; text-align: center; padding: 2rem; }
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back-link">← На дашборд</a>
        <h1>📋 Контракты</h1>

        <!-- Форма создания контракта (заглушка) -->
        <div class="create-form">
            <h3>➕ Создать контракт</h3>
            <div class="row">
                <div>
                    <label>Название</label>
                    <input type="text" id="contractTitle" placeholder="Название">
                </div>
                <div>
                    <label>Описание</label>
                    <input type="text" id="contractDesc" placeholder="Описание">
                </div>
                <div>
                    <label>Тип</label>
                    <select id="contractType">
                        <option value="tech">Технологичный</option>
                        <option value="agri">Аграрный</option>
                        <option value="military">Военный</option>
                        <option value="trade">Торговый</option>
                        <option value="mixed">Смешанный</option>
                        <option value="test">Тестовый</option>
                    </select>
                </div>
                <div>
                    <label>Награда (кредиты)</label>
                    <input type="number" id="contractReward" placeholder="100">
                </div>
                <div>
                    <label>Срок (часов)</label>
                    <input type="number" id="contractHours" placeholder="24" value="24">
                </div>
                <div>
                    <label>&nbsp;</label>
                    <button onclick="createContract()">Создать</button>
                </div>
            </div>
            <div id="createResult" style="color:#4ade80; margin-top:0.5rem;"></div>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <div>
                <label>Тип</label>
                <select id="filterType">
                    <option value="all">Все</option>
                    <option value="tech">Технологичный</option>
                    <option value="agri">Аграрный</option>
                    <option value="military">Военный</option>
                    <option value="trade">Торговый</option>
                    <option value="mixed">Смешанный</option>
                    <option value="test">Тестовый</option>
                </select>
            </div>
            <div>
                <label>Автор</label>
                <select id="filterAuthor">
                    <option value="all">Все</option>
                </select>
            </div>
            <div>
                <label>Мин. награда</label>
                <input type="number" id="filterMinReward" placeholder="0">
            </div>
            <div>
                <label>Макс. награда</label>
                <input type="number" id="filterMaxReward" placeholder="1000">
            </div>
            <div>
                <label>Поиск</label>
                <input type="text" id="filterSearch" placeholder="Название или описание">
            </div>
            <button onclick="loadContracts()">Применить</button>
        </div>

        <!-- Список контрактов -->
        <div id="contractsList" class="contracts-list">
            <div class="empty-message">Загрузка контрактов...</div>
        </div>
    </div>

    <script>
        let token = localStorage.getItem('token');
        if (!token) {
            if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
        }

        // Загрузка контрактов с фильтрами
        async function loadContracts() {
            const type = document.getElementById('filterType').value;
            const author = document.getElementById('filterAuthor').value;
            const minReward = document.getElementById('filterMinReward').value || 0;
            const maxReward = document.getElementById('filterMaxReward').value || 0;
            const search = document.getElementById('filterSearch').value;

            let url = '/api/contracts?';
            if (type !== 'all') url += 'type=' + type + '&';
            if (author !== 'all') url += 'author=' + author + '&';
            if (minReward > 0) url += 'min_reward=' + minReward + '&';
            if (maxReward > 0) url += 'max_reward=' + maxReward + '&';
            if (search) url += 'search=' + encodeURIComponent(search) + '&';

            // Лоадер со счётчиком
            const listEl = document.getElementById('contractsList');
            const start = Date.now();
            listEl.innerHTML = '<div class="empty-message">Загрузка контрактов... <span id="contractsLoaderTime" style="font-variant-numeric:tabular-nums;">0 с</span></div>';
            const timeEl = document.getElementById('contractsLoaderTime');
            const timer = setInterval(() => { timeEl.textContent = Math.round((Date.now() - start) / 1000) + ' с'; }, 250);

            try {
                const res = await fetch(url, {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                        return;
                    }
                    throw new Error('Ошибка загрузки контрактов');
                }
                const contracts = await res.json();
                clearInterval(timer);
                renderContracts(contracts);
            } catch (e) {
                document.getElementById('contractsList').innerHTML = '<div class="empty-message">❌ Ошибка загрузки: ' + e.message + '</div>';
            }
        }

        // Рендер контрактов
        function renderContracts(contracts) {
            const container = document.getElementById('contractsList');
            if (!contracts || contracts.length === 0) {
                container.innerHTML = '<div class="empty-message">📭 Нет доступных контрактов</div>';
                return;
            }
            let html = '';
            contracts.forEach(c => {
                const statusClass = c.status === 'open' ? 'status-open' : c.status === 'taken' ? 'status-taken' : c.status === 'completed' ? 'status-completed' : 'status-expired';
                const typeMap = { tech: 'Технологичный', agri: 'Аграрный', military: 'Военный', trade: 'Торговый', mixed: 'Смешанный', test: 'Тестовый' };
                const expires = new Date(c.expires_at).toLocaleString();

                let actions = '';
                if (c.status === 'open') {
                    actions += `<button class="btn-take" onclick="takeContract('${c.id}')">Взять</button>`;
                } else if (c.status === 'taken') {
                    if (c.type === 'test') {
                        actions += `<button class="btn-complete" onclick="completeTestContract('${c.id}')">Выполнить (тест)</button>`;
                    } else {
                        actions += `<button class="btn-disabled" disabled>В процессе</button>`;
                    }
                } else {
                    actions += `<span class="status-badge ${statusClass}">${c.status}</span>`;
                }

                html += `
                    <div class="contract-card">
                        <div class="contract-info">
                            <h3>${c.title}</h3>
                            <p>${c.description}</p>
                            <div class="contract-meta">
                                <span>Тип: ${typeMap[c.type] || c.type}</span>
                                <span>Автор: ${c.author_type} (${c.author_id.substring(0,8)})</span>
                                <span>Награда: ${c.reward} кредитов</span>
                                <span>Истекает: ${expires}</span>
                                <span class="status-badge ${statusClass}">${c.status}</span>
                            </div>
                        </div>
                        <div class="contract-actions">
                            ${actions}
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        // Взять контракт
        async function takeContract(id) {
            try {
                const res = await fetch('/api/contracts/take', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ contract_id: id })
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                        return;
                    }
                    const text = await res.text();
                    alert('Ошибка: ' + text);
                    return;
                }
                alert('Контракт взят!');
                loadContracts();
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // Выполнить тестовый контракт
        async function completeTestContract(id) {
            try {
                const res = await fetch('/api/contracts/complete-test', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ contract_id: id })
                });
                if (!res.ok) {
                    if (res.status === 401 || res.status === 403) {
                        if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
                        return;
                    }
                    const text = await res.text();
                    alert('Ошибка: ' + text);
                    return;
                }
                alert('Контракт выполнен!');
                loadContracts();
            } catch (e) {
                alert('Ошибка: ' + e.message);
            }
        }

        // Создать контракт (заглушка)
        async function createContract() {
            const title = document.getElementById('contractTitle').value.trim();
            const desc = document.getElementById('contractDesc').value.trim();
            const type = document.getElementById('contractType').value;
            const reward = parseInt(document.getElementById('contractReward').value);
            const hours = parseInt(document.getElementById('contractHours').value);
            if (!title || !desc || isNaN(reward) || isNaN(hours)) {
                document.getElementById('createResult').textContent = '❌ Заполните все поля';
                return;
            }
            document.getElementById('createResult').textContent = '⚠️ Создание контрактов игроками будет добавлено позже.';
        }

        // Инициализация
        loadContracts();

        // Автообновление при изменении фильтров
        document.querySelectorAll('.filters input, .filters select').forEach(el => {
            el.addEventListener('change', loadContracts);
        });
    </script>
</body>
</html>
