<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Дашборд</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f0f4fa; padding: 2rem; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 1rem; border: 1px solid #334155; margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .info p { margin-bottom: 0.3rem; color: #cbd5e1; }
        .info strong { color: #f0f4fa; }
        button { background: #3b82f6; border: none; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; margin-right: 0.5rem; }
        button:hover { background: #2563eb; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        .enc-section { margin-bottom: 1.5rem; }
        .enc-section h3 { margin-bottom: 0.6rem; color: #e2e8f0; }
        .journal-note { font-size: 0.7rem; color: #64748b; margin-top: 0.4rem; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🚀 Ваш агент</h1>
            <div class="info">
                <p><strong>Имя:</strong> <span id="agentName">Искатель</span></p>
                <p><strong>Корабль:</strong> <span id="shipPreview"></span></p>
                <p><strong>Текущий мир:</strong> <span id="currentWorld">—</span></p>
                <p><strong>Статус полёта:</strong> <span id="flightStatus">—</span></p>
            </div>
            <button onclick="location.href='/assignments'">📋 Контракты</button>
            <button onclick="location.href='/map'">🗺️ Карта миров</button>
            <button class="btn-secondary" id="logoutBtn">🚪 Выйти</button>
        </div>

        <div class="card">
            <h2>📊 Статистика</h2>
            <div id="stats"></div>
            <div class="journal-note">Журнал открытий хранится в этом браузере (localStorage).</div>
        </div>

        <div class="card">
            <h2>📖 Энциклопедия</h2>
            <div id="encyclopedia"></div>
        </div>

        <div class="card">
            <h2>🚀 Корабль</h2>
            <div id="ship-sel" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px; margin-top:10px;"></div>
            <div id="ship-palette" style="display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap;"></div>
            <div id="ship-status" style="margin-top:10px; font-size:0.8rem; color:#94a3b8;"></div>
        </div>
    </div>

    <script type="module">
        import { recolorShipSprite, getShipImage, setRedrawCallback, SHIP_COLOR_PALETTE } from '/static/js/map/ship_sprites.js';
        import { loadEncyclopedia } from '/static/js/dashboard/encyclopedia.js';

        // shipPreviewEl — миниатюра 52px для шапки профиля (спека 86a §4.1):
        // перекрашенный canvas (если цвет задан и спрайт загружен), иначе
        // исходный Image, иначе пустой div (спрайт ещё грузится).
        function shipPreviewEl(file, color) {
            const preview = recolorShipSprite(file, color);
            if (preview) {
                preview.style.cssText = 'width:52px; height:52px; vertical-align:middle;';
                return preview;
            }
            const img = getShipImage(file);
            if (img) {
                img.style.cssText = 'width:52px; height:52px; vertical-align:middle;';
                return img;
            }
            const div = document.createElement('div');
            div.style.cssText = 'width:52px; height:52px; display:inline-block;';
            return div;
        }

        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load user');
                const data = await res.json();
                document.getElementById('agentName').textContent = data.username || 'Искатель';
                document.getElementById('currentWorld').textContent = data.current_world_name || '—';
                // Статус полёта (спека 86a §4.1): /me.flight — {from, to, ...}
                // (from/to — id миров) или null = «на месте».
                const flight = data.flight;
                const flightEl = document.getElementById('flightStatus');
                if (flight) {
                    flightEl.textContent = `🚀 В полёте: ${flight.from} → ${flight.to}`;
                } else {
                    flightEl.textContent = 'На месте';
                }
                // Корабль-превью в шапке (спрайт + цвет из /me).
                const previewWrap = document.getElementById('shipPreview');
                if (previewWrap) {
                    previewWrap.innerHTML = '';
                    previewWrap.appendChild(shipPreviewEl(data.ship_icon, data.ship_color || null));
                }
            } catch (e) {
                console.error(e);
            }
        }

        // ==================== КОРАБЛЬ (спека 61b §6.1) ====================
        // Сетка 21 спрайта из /me.ship_options (реестр с сервера, И1),
        // превью — recolorShipSprite(file, текущий цвет); палитра 9 цветов
        // + «Оригинал» (NULL). Сохранение: PUT /me/ship-icon + PUT /me/ship-color.
        // Палитра — единый источник на клиенте (ship_sprites.js, уточнение
        // 2026-09-16): SHIP_COLOR_PALETTE, порядок совпадает с серверным.

        let shipOptions = []; // 21 {id, name, file} из /me
        let shipIcon = '';    // выбранный PNG-файл
        let shipColor = null; // выбранный цвет (null = «Оригинал»)

        // shipTilePreviewEl — миниатюра 52px для сетки выбора: перекрашенный
        // canvas (если цвет задан и спрайт загружен), иначе исходный Image,
        // иначе пустой div (спрайт ещё грузится — onload перерисует сетку
        // через scheduleRedraw).
        function shipTilePreviewEl(file, color) {
            const preview = recolorShipSprite(file, color);
            if (preview) {
                preview.style.cssText = 'width:52px; height:52px; pointer-events:none;';
                return preview;
            }
            const img = getShipImage(file);
            if (img) {
                img.style.cssText = 'width:52px; height:52px; pointer-events:none;';
                return img;
            }
            const div = document.createElement('div');
            div.style.cssText = 'width:52px; height:52px;';
            return div;
        }

        function renderShipGrid() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            sel.innerHTML = '';
            shipOptions.forEach(s => {
                const tile = document.createElement('div');
                tile.dataset.file = s.file;
                tile.title = s.name;
                tile.style.cssText = `
                    display:flex; flex-direction:column; align-items:center; gap:4px;
                    padding:6px; border:2px solid #334155; border-radius:10px;
                    background:#0f172a; cursor:pointer; transition:0.15s;
                `;
                tile.appendChild(shipTilePreviewEl(s.file, shipColor));
                const span = document.createElement('span');
                span.textContent = s.name;
                span.style.cssText = 'font-size:0.62rem; color:#94a3b8; text-align:center; line-height:1;';
                tile.appendChild(span);
                tile.addEventListener('click', () => selectShip(s.file));
                sel.appendChild(tile);
            });
            markSelectedShip();
        }

        function markSelectedShip() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            sel.querySelectorAll('[data-file]').forEach(t => {
                const selected = t.dataset.file === shipIcon;
                t.style.borderColor = selected ? '#60a5fa' : '#334155';
                t.style.background = selected ? '#1e3a8a' : '#0f172a';
            });
        }

        function renderPalette() {
            const pal = document.getElementById('ship-palette');
            if (!pal) return;
            pal.innerHTML = '';

            // «Оригинал» (NULL) — спрайт без перекраски.
            const orig = document.createElement('div');
            orig.dataset.color = '';
            orig.title = 'Оригинал (без перекраски)';
            orig.textContent = 'Оригинал';
            orig.style.cssText = `
                padding:4px 10px; border-radius:14px; border:2px solid #334155;
                background:#0f172a; color:#94a3b8; font-size:0.75rem;
                cursor:pointer; transition:0.15s;
            `;
            orig.addEventListener('click', () => selectColor(null));
            pal.appendChild(orig);

            // 9 хроматических свотчей (спека §5.5).
            SHIP_COLOR_PALETTE.forEach(c => {
                const sw = document.createElement('div');
                sw.dataset.color = c;
                sw.title = c;
                sw.style.cssText = `
                    width:28px; height:28px; border-radius:50%;
                    background:${c}; border:2px solid #334155;
                    cursor:pointer; transition:0.15s;
                `;
                sw.addEventListener('click', () => selectColor(c));
                pal.appendChild(sw);
            });
            markSelectedColor();
        }

        function markSelectedColor() {
            const pal = document.getElementById('ship-palette');
            if (!pal) return;
            pal.querySelectorAll('[data-color]').forEach(t => {
                const selected = (t.dataset.color || null) === shipColor;
                t.style.borderColor = selected ? '#60a5fa' : '#334155';
                t.style.outline = selected ? '2px solid #60a5fa' : 'none';
                if (t.dataset.color === '') {
                    t.style.background = selected ? '#1e3a8a' : '#0f172a';
                    t.style.color = selected ? '#f0f4fa' : '#94a3b8';
                }
            });
        }

        function redirectToLogin() {
            if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
        }

        function selectShip(file) {
            shipIcon = file;
            markSelectedShip();
            const status = document.getElementById('ship-status');
            if (status) status.textContent = '⏳ Сохранение...';
            const token = localStorage.getItem('token');
            if (!token) {
                redirectToLogin();
                return;
            }
            fetch('/me/ship-icon', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ ship_icon: file })
            })
            .then(async res => {
                if (res.status === 401 || res.status === 403) {
                    redirectToLogin();
                    return;
                }
                if (!res.ok) {
                    let msg = 'Ошибка сохранения';
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                shipIcon = data.ship_icon;
                markSelectedShip();
                if (status) status.textContent = '✅ Иконка сохранена';
            })
            .catch(e => {
                if (status) status.textContent = '❌ ' + e.message;
            });
        }

        function selectColor(color) {
            shipColor = color;
            renderShipGrid(); // перекрасить превью сетки (лениво, кэш)
            markSelectedColor();
            const status = document.getElementById('ship-status');
            if (status) status.textContent = '⏳ Сохранение...';
            const token = localStorage.getItem('token');
            if (!token) {
                redirectToLogin();
                return;
            }
            fetch('/me/ship-color', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ ship_color: color })
            })
            .then(async res => {
                if (res.status === 401 || res.status === 403) {
                    redirectToLogin();
                    return;
                }
                if (!res.ok) {
                    let msg = 'Ошибка сохранения';
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                shipColor = data.ship_color || null;
                renderShipGrid();
                markSelectedColor();
                if (status) status.textContent = '✅ Цвет сохранён';
            })
            .catch(e => {
                if (status) status.textContent = '❌ ' + e.message;
            });
        }

        async function loadShipSelector() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) return;
                const data = await res.json();
                shipOptions = Array.isArray(data.ship_options) ? data.ship_options : [];
                if (data.ship_icon) shipIcon = data.ship_icon; // уже смапплено сервером
                shipColor = data.ship_color || null;
                renderShipGrid();
                renderPalette();
            } catch (e) {
                console.error(e);
            }
        }

        // Перерисовка превью после асинхронной загрузки спрайтов
        // (onload → scheduleRedraw → этот колбэк; паттерн из ship_sprites.js).
        setRedrawCallback(renderShipGrid);

        loadUser();
        loadShipSelector();
        loadEncyclopedia();

        // Выход из аккаунта (мелкая правка 2026-09-17): чистим игровой
        // токен из localStorage и уходим на страницу входа. Игровой токен
        // ('token') не пересекается с админским ('adminToken').
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('shipIcon');
            localStorage.removeItem('shipColor');
            window.location.href = '/login-page';
        });
    </script>
</body>
</html>
