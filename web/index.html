<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Дашборд</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f0f4fa; padding: 2rem; min-height: 100vh; }
        .container { max-width: 600px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 1rem; border: 1px solid #334155; margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .info p { margin-bottom: 0.3rem; color: #cbd5e1; }
        .info strong { color: #f0f4fa; }
        select { width: 100%; padding: 0.7rem; border-radius: 0.6rem; border: 1px solid #334155; background: #0f172a; color: #f0f4fa; margin: 1rem 0; }
        button { background: #3b82f6; border: none; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; margin-right: 0.5rem; }
        button:hover { background: #2563eb; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        #travelStatus { margin-top: 1rem; color: #60a5fa; }
        .error { color: #f87171; }
        .success { color: #4ade80; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🚀 Ваш агент</h1>
            <div class="info">
                <p><strong>Имя:</strong> <span id="agentName">Искатель</span></p>
                <p><strong>Текущий мир:</strong> <span id="currentWorld">—</span></p>
                <p><strong>Скорость:</strong> <span id="speed">1.0</span> л.с.</p>
                <p><strong>Грузоподъёмность:</strong> <span id="cargo">100</span></p>
            </div>
            <button onclick="location.href='/assignments'">📋 Контракты</button>
            <button onclick="location.href='/map'">🗺️ Карта миров</button>
            <button onclick="location.href='/worlds'">🌍 Список миров (JSON)</button>
        </div>

        <div class="card">
            <h2>🚀 Иконка корабля</h2>
            <div id="ship-sel" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px; margin-top:10px;"></div>
            <div id="ship-status" style="margin-top:10px; font-size:0.8rem; color:#94a3b8;"></div>
        </div>

        <div class="card">
            <h2>🧭 Перемещение</h2>
            <label for="worldSelect" style="display:block;margin-bottom:0.5rem;">Выберите мир для полёта:</label>
            <select id="worldSelect">
                <option value="">Загрузка миров...</option>
            </select>
            <button onclick="startTravel()">🚀 Лететь</button>
            <div id="travelStatus"></div>
        </div>
    </div>

    <script>
        let worlds = [];
        let currentWorldId = null;

        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load user');
                const data = await res.json();
                currentWorldId = data.current_world_id;
                document.getElementById('currentWorld').textContent = data.current_world_name || '—';
            } catch (e) {
                console.error(e);
            }
        }

        async function loadWorlds() {
            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('worldSelect').innerHTML = '<option value="">Не авторизован</option>';
                return;
            }
            try {
                const res = await fetch('/worlds', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Ошибка загрузки миров');
                worlds = await res.json();

                const select = document.getElementById('worldSelect');
                select.innerHTML = '';
                if (worlds.length === 0) {
                    select.innerHTML = '<option value="">Нет миров</option>';
                    return;
                }
                worlds.forEach(w => {
                    const option = document.createElement('option');
                    option.value = w.id;
                    option.textContent = w.name + ' (x:' + w.coord_x + ', y:' + w.coord_y + ')';
                    select.appendChild(option);
                });
                if (currentWorldId) {
                    select.value = currentWorldId;
                }
            } catch (e) {
                document.getElementById('worldSelect').innerHTML = '<option value="">Ошибка загрузки</option>';
                console.error(e);
            }
        }

        async function startTravel() {
            const select = document.getElementById('worldSelect');
            const worldId = select.value;
            if (!worldId) {
                document.getElementById('travelStatus').innerHTML = '<span class="error">❌ Выберите мир для полёта</span>';
                return;
            }

            const token = localStorage.getItem('token');
            if (!token) {
                document.getElementById('travelStatus').innerHTML = '<span class="error">❌ Вы не авторизованы</span>';
                return;
            }

            const statusEl = document.getElementById('travelStatus');
            statusEl.innerHTML = '⏳ Отправка запроса...';

            try {
                const res = await fetch('/travel', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + token
                    },
                    body: JSON.stringify({ world_id: worldId })
                });
                const text = await res.text();
                if (!res.ok) {
                    statusEl.innerHTML = '<span class="error">❌ Ошибка: ' + text + '</span>';
                    return;
                }
                const data = JSON.parse(text);
                statusEl.innerHTML = `<span class="success">🚀 Полёт начат! Длительность: ${data.duration} секунд. Прибытие через ${data.duration} сек.</span>`;
                let remaining = data.duration;
                const interval = setInterval(() => {
                    remaining--;
                    if (remaining <= 0) {
                        clearInterval(interval);
                        statusEl.innerHTML = `<span class="success">✅ Прибытие! (обновите страницу)</span>`;
                        loadUser();
                        loadWorlds();
                    } else {
                        statusEl.innerHTML = `🚀 В полёте... осталось ${remaining} сек.`;
                    }
                }, 1000);
            } catch (e) {
                statusEl.innerHTML = '<span class="error">❌ Ошибка сети</span>';
                console.error(e);
            }
        }

        // ==================== ИКОНКА КОРАБЛЯ ====================

        let shipIcon = 'ship_strela.svg';

        async function loadShips() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            try {
                const res = await fetch('/static/sprites/ships.json');
                if (!res.ok) throw new Error('HTTP ' + res.status);
                const ships = await res.json();
                sel.innerHTML = '';
                ships.forEach(s => {
                    const tile = document.createElement('div');
                    tile.dataset.file = s.file;
                    tile.title = s.name;
                    tile.style.cssText = `
                        display:flex; flex-direction:column; align-items:center; gap:4px;
                        padding:6px; border:2px solid #334155; border-radius:10px;
                        background:#0f172a; cursor:pointer; transition:0.15s;
                    `;
                    tile.innerHTML = `<img src="/static/sprites/${s.file}" alt="${s.name}" style="width:52px; height:52px; pointer-events:none;">
                        <span style="font-size:0.62rem; color:#94a3b8; text-align:center; line-height:1;">${s.name}</span>`;
                    tile.addEventListener('click', () => selectShip(s.file));
                    sel.appendChild(tile);
                });
                markSelectedShip();
            } catch (e) {
                console.error('loadShips error:', e);
            }
        }

        function selectShip(file) {
            shipIcon = file;
            markSelectedShip();
            const status = document.getElementById('ship-status');
            if (status) status.textContent = '⏳ Сохранение...';
            const token = localStorage.getItem('token');
            if (!token) {
                if (status) status.textContent = '❌ Не авторизован';
                return;
            }
            fetch('/me/ship-icon', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ ship_icon: file })
            })
            .then(async res => {
                if (!res.ok) {
                    let msg = 'Ошибка сохранения';
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                shipIcon = data.ship_icon;
                markSelectedShip();
                if (status) status.textContent = '✅ Иконка сохранена';
            })
            .catch(e => {
                if (status) status.textContent = '❌ ' + e.message;
            });
        }

        function markSelectedShip() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            sel.querySelectorAll('[data-file]').forEach(t => {
                t.style.borderColor = t.dataset.file === shipIcon ? '#60a5fa' : '#334155';
                t.style.background = t.dataset.file === shipIcon ? '#1e3a8a' : '#0f172a';
            });
        }

        async function loadShipIcon() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) return;
                const data = await res.json();
                if (data.ship_icon) {
                    shipIcon = data.ship_icon;
                    markSelectedShip();
                }
            } catch (e) {
                console.error(e);
            }
        }

        async function initShipSelector() {
            await Promise.all([loadShips(), loadShipIcon()]);
        }

        loadUser().then(loadWorlds);
        initShipSelector();
    </script>
</body>
</html>
