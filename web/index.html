<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Дашборд</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #0f172a; color: #f0f4fa; padding: 2rem; min-height: 100vh; }
        .container { max-width: 1000px; margin: 0 auto; }
        .card { background: #1e293b; padding: 1.5rem; border-radius: 1rem; border: 1px solid #334155; margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        .info p { margin-bottom: 0.3rem; color: #cbd5e1; }
        .info strong { color: #f0f4fa; }
        button { background: #3b82f6; border: none; color: white; padding: 0.6rem 1.2rem; border-radius: 2rem; cursor: pointer; transition: 0.2s; margin-right: 0.5rem; }
        button:hover { background: #2563eb; }
        .btn-secondary { background: #475569; }
        .btn-secondary:hover { background: #334155; }
        .enc-section { margin-bottom: 1.5rem; }
        .enc-section h3 { margin-bottom: 0.6rem; color: #e2e8f0; }
        .journal-note { font-size: 0.7rem; color: #64748b; margin-top: 0.4rem; }
        /* Раздел «Корабль» (спека 91a §3–§6): превью + силуэт со слотами + сводные характеристики. */
        #ship-section-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        #shipSectionModelName { font-size: 1.1rem; font-weight: 600; }
        #ship-silhouette { position: relative; max-width: 420px; margin: 0 auto 12px; }
        .ship-slot {
            position: absolute;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 10px;
            padding: 4px 10px;
            text-align: center;
            font-size: 0.72rem;
            min-width: 120px;
            transform: translateX(-50%);
            z-index: 2;
        }
        .ship-slot-empty { border-color: #334155; color: #64748b; }
        .ship-slot-future {
            min-width: 26px;
            min-height: 26px;
            border: 2px dashed #334155;
            background: transparent;
            opacity: 0.55;
            padding: 0;
        }
        #ship-section-stats { border-top: 1px solid #334155; padding-top: 10px; font-size: 0.85rem; }
        /* Вкладки дашборда (идея 2026-09-18): паттерн админки (.tab-btn/.tab-pane),
           стиль — в тон дашборда (тёмная тема). Активная вкладка — localStorage
           dashboardActiveTab, дефолт «Корабль». */
        .dashboard-tabs {
            display: flex;
            gap: 4px;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 4px;
            flex-wrap: wrap;
        }
        .dashboard-tabs button {
            background: none;
            border: none;
            margin: 0;
            padding: 8px 16px;
            color: #94a3b8;
            cursor: pointer;
            font-size: 0.9rem;
            border-radius: 4px 4px 0 0;
            transition: background 0.2s, color 0.2s;
        }
        .dashboard-tabs button:hover {
            background: #1e293b;
            color: #e2e8f0;
        }
        .dashboard-tabs button.active {
            background: #1e293b;
            color: #f1f5f9;
            border-bottom: 2px solid #3b82f6;
        }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>🚀 Ваш агент</h1>
            <div class="info">
                <p><strong>Имя:</strong> <span id="agentName">Искатель</span></p>
                <p><strong>Корабль:</strong> <span id="shipPreview"></span></p>
                <p><strong>Текущий мир:</strong> <span id="currentWorld">—</span></p>
                <p><strong>Статус полёта:</strong> <span id="flightStatus">—</span></p>
            </div>
            <button onclick="location.href='/assignments'">📋 Контракты</button>
            <button onclick="location.href='/map'">🗺️ Карта миров</button>
            <button class="btn-secondary" id="logoutBtn">🚪 Выйти</button>
        </div>

        <div class="dashboard-tabs">
            <button class="tab-btn" data-tab="tab-ship">🛸 Корабль</button>
            <button class="tab-btn" data-tab="tab-look">🎨 Внешний вид</button>
            <button class="tab-btn" data-tab="tab-stats">📊 Статистика</button>
            <button class="tab-btn" data-tab="tab-encyclopedia">📖 Энциклопедия</button>
        </div>

        <div class="tab-pane" id="tab-ship">
            <div class="card">
                <h2>🛸 Корабль</h2>
                <div id="ship-section">
                    <div id="ship-section-header">
                        <span id="shipSectionPreview"></span>
                        <span id="shipSectionModelName">—</span>
                    </div>
                    <div id="ship-silhouette">
                        <!-- Схематичный силуэт корабля (спека 91a §4.1): кодовая
                             SVG-фигура, без новых ассетов. Ячейки-слоты — HTML
                             поверх силуэта: радар (нос), сканер (центр), двигатель
                             (корма) + пустые ячейки будущих слотов (по бортам). -->
                        <svg viewBox="0 0 300 170" style="width:100%; display:block;">
                            <path d="M150 10 L205 55 L205 105 L150 160 L95 105 L95 55 Z" fill="#0f172a" stroke="#475569" stroke-width="2"/>
                            <path d="M150 10 L172 48 L128 48 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
                            <path d="M150 160 L172 118 L128 118 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
                            <path d="M95 72 L58 90 L58 102 L95 94 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
                            <path d="M205 72 L242 90 L242 102 L205 94 Z" fill="#1e293b" stroke="#475569" stroke-width="1.5"/>
                            <line x1="150" y1="48" x2="150" y2="118" stroke="#334155" stroke-width="1.5" stroke-dasharray="4 4"/>
                        </svg>
                        <div class="ship-slot" id="slot-radar" style="top:6%; left:50%;"></div>
                        <div class="ship-slot" id="slot-scanner" style="top:40%; left:50%;"></div>
                        <div class="ship-slot" id="slot-engine" style="top:74%; left:50%;"></div>
                        <div class="ship-slot ship-slot-future" style="top:28%; left:16%;"></div>
                        <div class="ship-slot ship-slot-future" style="top:28%; left:84%;"></div>
                        <div class="ship-slot ship-slot-future" style="top:52%; left:10%;"></div>
                        <div class="ship-slot ship-slot-future" style="top:52%; left:90%;"></div>
                    </div>
                    <div id="ship-section-stats"></div>
                </div>
            </div>
        </div>

        <div class="tab-pane" id="tab-look">
            <div class="card">
                <h2>🎨 Внешний вид</h2>
                <div id="ship-sel" style="display:grid; grid-template-columns:repeat(auto-fill, minmax(64px, 1fr)); gap:8px; margin-top:10px;"></div>
                <div id="ship-palette" style="display:flex; gap:8px; margin-top:12px; align-items:center; flex-wrap:wrap;"></div>
                <div id="ship-status" style="margin-top:10px; font-size:0.8rem; color:#94a3b8;"></div>
            </div>
        </div>

        <div class="tab-pane" id="tab-stats">
            <div class="card">
                <h2>📊 Статистика</h2>
                <div id="stats"></div>
                <div class="journal-note">Журнал открытий хранится в этом браузере (localStorage).</div>
            </div>
        </div>

        <div class="tab-pane" id="tab-encyclopedia">
            <div class="card">
                <h2>📖 Энциклопедия</h2>
                <div id="encyclopedia"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import { recolorShipSprite, getShipImage, setRedrawCallback, SHIP_COLOR_PALETTE } from '/static/js/map/ship_sprites.js';
        import { loadEncyclopedia } from '/static/js/dashboard/encyclopedia.js';

        // shipPreviewEl — миниатюра 52px для шапки профиля (спека 86a §4.1):
        // перекрашенный canvas (если цвет задан и спрайт загружен), иначе
        // исходный Image, иначе пустой div (спрайт ещё грузится).
        function shipPreviewEl(file, color) {
            const preview = recolorShipSprite(file, color);
            if (preview) {
                preview.style.cssText = 'width:52px; height:52px; vertical-align:middle;';
                return preview;
            }
            const img = getShipImage(file);
            if (img) {
                img.style.cssText = 'width:52px; height:52px; vertical-align:middle;';
                return img;
            }
            const div = document.createElement('div');
            div.style.cssText = 'width:52px; height:52px; display:inline-block;';
            return div;
        }

        // ==================== РАЗДЕЛ «КОРАБЛЬ» (спека 91a §3–§6) ====================
        // Показывает только установленное (И1): слоты из users.equipment, имена
        // и характеристики — из ship_catalog (с сервера, И2). Каталог «что
        // бывает» в UI не рисуется; будущие слоты — пустые ячейки без подписей.

        // slotDetail — характеристики установленного модуля для ячейки слота.
        function slotDetail(type, item) {
            const p = item.params || {};
            switch (type) {
                case 'radar':
                    return 'Радиус: ' + (typeof p.radius === 'number' ? p.radius : '—') + ' px';
                case 'scanner': {
                    const depth = p.depth === 'surface' ? 'поверхность' : (p.depth || '—');
                    return 'Глубина: ' + depth + (p.settlements ? ' · Поселения: да' : '');
                }
                case 'engine':
                    return 'Скорость: ' + (typeof p.speed_factor === 'number' ? p.speed_factor : '—') + ' сек/px';
                default:
                    return '';
            }
        }

        function renderShipSection(data) {
            const catalog = Array.isArray(data.ship_catalog) ? data.ship_catalog : [];
            const catalogById = {};
            catalog.forEach(i => { catalogById[i.id] = i; });
            const equipment = data.equipment || {};

            // Превью корабля (спрайт + цвет, 61b) + имя модели.
            const previewWrap = document.getElementById('shipSectionPreview');
            if (previewWrap) {
                previewWrap.innerHTML = '';
                previewWrap.appendChild(shipPreviewEl(data.ship_icon, data.ship_color || null));
            }
            const nameEl = document.getElementById('shipSectionModelName');
            if (nameEl) nameEl.textContent = (data.ship_model && data.ship_model.name) || '—';

            // Ячейки-слоты на силуэте: радар (нос), сканер (центр), двигатель (корма).
            const slotDefs = [
                { key: 'radar', icon: '📡' },
                { key: 'scanner', icon: '🔭' },
                { key: 'engine', icon: '⚙️' },
            ];
            slotDefs.forEach(def => {
                const el = document.getElementById('slot-' + def.key);
                if (!el) return;
                el.innerHTML = '';
                const itemId = equipment[def.key];
                const item = itemId ? catalogById[itemId] : null;
                if (item) {
                    el.classList.remove('ship-slot-empty');
                    const icon = document.createElement('div');
                    icon.textContent = def.icon;
                    const name = document.createElement('div');
                    name.textContent = item.name;
                    name.style.fontWeight = '600';
                    const detail = document.createElement('div');
                    detail.textContent = slotDetail(def.key, item);
                    detail.style.color = '#94a3b8';
                    el.appendChild(icon);
                    el.appendChild(name);
                    el.appendChild(detail);
                } else {
                    el.classList.add('ship-slot-empty');
                    const icon = document.createElement('div');
                    icon.textContent = def.icon;
                    const name = document.createElement('div');
                    name.textContent = 'не установлен';
                    el.appendChild(icon);
                    el.appendChild(name);
                }
            });

            // Сводные характеристики: радиус радара, возможности сканера, скорость.
            const statsEl = document.getElementById('ship-section-stats');
            if (!statsEl) return;
            statsEl.innerHTML = '';
            const scannerItem = catalogById[equipment.scanner];
            const rows = [];
            // Радиус радара — из /me.radar_radius (И3: один источник — установленный радар).
            rows.push(['Радиус радара', (typeof data.radar_radius === 'number') ? data.radar_radius + ' px' : '—']);
            if (scannerItem) {
                const p = scannerItem.params || {};
                const depth = p.depth === 'surface' ? 'поверхность' : (p.depth || '—');
                rows.push(['Сканер', depth + (p.settlements ? ' + поселения' : '')]);
            } else {
                rows.push(['Сканер', 'не установлен']);
            }
            // Скорость — из /me.ship_speed_factor (И2: не хардкод в клиенте);
            // без двигателя поле отсутствует — «не установлен» (спека 91a §6.1).
            if (typeof data.ship_speed_factor === 'number') {
                rows.push(['Скорость', data.ship_speed_factor + ' сек/px']);
            } else {
                rows.push(['Скорость', 'не установлен']);
            }
            rows.forEach(([k, v]) => {
                const row = document.createElement('div');
                row.style.cssText = 'display:flex; justify-content:space-between; gap:12px; padding:2px 0;';
                const kEl = document.createElement('span');
                kEl.textContent = k;
                kEl.style.color = '#94a3b8';
                const vEl = document.createElement('span');
                vEl.textContent = v;
                row.appendChild(kEl);
                row.appendChild(vEl);
                statsEl.appendChild(row);
            });
        }

        async function loadUser() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', {
                    headers: { 'Authorization': 'Bearer ' + token }
                });
                if (!res.ok) throw new Error('Failed to load user');
                const data = await res.json();
                document.getElementById('agentName').textContent = data.username || 'Искатель';
                document.getElementById('currentWorld').textContent = data.current_world_name || '—';
                // Статус полёта (спека 86a §4.1): /me.flight — {from, to, ...}
                // (from/to — id миров) или null = «на месте».
                const flight = data.flight;
                const flightEl = document.getElementById('flightStatus');
                if (flight) {
                    flightEl.textContent = `🚀 В полёте: ${flight.from} → ${flight.to}`;
                } else {
                    flightEl.textContent = 'На месте';
                }
                // Корабль-превью в шапке (спрайт + цвет из /me).
                const previewWrap = document.getElementById('shipPreview');
                if (previewWrap) {
                    previewWrap.innerHTML = '';
                    previewWrap.appendChild(shipPreviewEl(data.ship_icon, data.ship_color || null));
                }
                // Раздел «Корабль» (спека 91a): силуэт со слотами + характеристики.
                renderShipSection(data);
            } catch (e) {
                console.error(e);
            }
        }

        // ==================== КОРАБЛЬ (спека 61b §6.1) ====================
        // Сетка 21 спрайта из /me.ship_options (реестр с сервера, И1),
        // превью — recolorShipSprite(file, текущий цвет); палитра 9 цветов
        // + «Оригинал» (NULL). Сохранение: PUT /me/ship-icon + PUT /me/ship-color.
        // Палитра — единый источник на клиенте (ship_sprites.js, уточнение
        // 2026-09-16): SHIP_COLOR_PALETTE, порядок совпадает с серверным.

        let shipOptions = []; // 21 {id, name, file} из /me
        let shipIcon = '';    // выбранный PNG-файл
        let shipColor = null; // выбранный цвет (null = «Оригинал»)

        // shipTilePreviewEl — миниатюра 52px для сетки выбора: перекрашенный
        // canvas (если цвет задан и спрайт загружен), иначе исходный Image,
        // иначе пустой div (спрайт ещё грузится — onload перерисует сетку
        // через scheduleRedraw).
        function shipTilePreviewEl(file, color) {
            const preview = recolorShipSprite(file, color);
            if (preview) {
                preview.style.cssText = 'width:52px; height:52px; pointer-events:none;';
                return preview;
            }
            const img = getShipImage(file);
            if (img) {
                img.style.cssText = 'width:52px; height:52px; pointer-events:none;';
                return img;
            }
            const div = document.createElement('div');
            div.style.cssText = 'width:52px; height:52px;';
            return div;
        }

        function renderShipGrid() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            sel.innerHTML = '';
            shipOptions.forEach(s => {
                const tile = document.createElement('div');
                tile.dataset.file = s.file;
                tile.title = s.name;
                tile.style.cssText = `
                    display:flex; flex-direction:column; align-items:center; gap:4px;
                    padding:6px; border:2px solid #334155; border-radius:10px;
                    background:#0f172a; cursor:pointer; transition:0.15s;
                `;
                tile.appendChild(shipTilePreviewEl(s.file, shipColor));
                const span = document.createElement('span');
                span.textContent = s.name;
                span.style.cssText = 'font-size:0.62rem; color:#94a3b8; text-align:center; line-height:1;';
                tile.appendChild(span);
                tile.addEventListener('click', () => selectShip(s.file));
                sel.appendChild(tile);
            });
            markSelectedShip();
        }

        function markSelectedShip() {
            const sel = document.getElementById('ship-sel');
            if (!sel) return;
            sel.querySelectorAll('[data-file]').forEach(t => {
                const selected = t.dataset.file === shipIcon;
                t.style.borderColor = selected ? '#60a5fa' : '#334155';
                t.style.background = selected ? '#1e3a8a' : '#0f172a';
            });
        }

        function renderPalette() {
            const pal = document.getElementById('ship-palette');
            if (!pal) return;
            pal.innerHTML = '';

            // «Оригинал» (NULL) — спрайт без перекраски.
            const orig = document.createElement('div');
            orig.dataset.color = '';
            orig.title = 'Оригинал (без перекраски)';
            orig.textContent = 'Оригинал';
            orig.style.cssText = `
                padding:4px 10px; border-radius:14px; border:2px solid #334155;
                background:#0f172a; color:#94a3b8; font-size:0.75rem;
                cursor:pointer; transition:0.15s;
            `;
            orig.addEventListener('click', () => selectColor(null));
            pal.appendChild(orig);

            // 9 хроматических свотчей (спека §5.5).
            SHIP_COLOR_PALETTE.forEach(c => {
                const sw = document.createElement('div');
                sw.dataset.color = c;
                sw.title = c;
                sw.style.cssText = `
                    width:28px; height:28px; border-radius:50%;
                    background:${c}; border:2px solid #334155;
                    cursor:pointer; transition:0.15s;
                `;
                sw.addEventListener('click', () => selectColor(c));
                pal.appendChild(sw);
            });
            markSelectedColor();
        }

        function markSelectedColor() {
            const pal = document.getElementById('ship-palette');
            if (!pal) return;
            pal.querySelectorAll('[data-color]').forEach(t => {
                const selected = (t.dataset.color || null) === shipColor;
                t.style.borderColor = selected ? '#60a5fa' : '#334155';
                t.style.outline = selected ? '2px solid #60a5fa' : 'none';
                if (t.dataset.color === '') {
                    t.style.background = selected ? '#1e3a8a' : '#0f172a';
                    t.style.color = selected ? '#f0f4fa' : '#94a3b8';
                }
            });
        }

        function redirectToLogin() {
            if (window.location.pathname !== '/login-page') window.location.href = '/login-page';
        }

        function selectShip(file) {
            shipIcon = file;
            markSelectedShip();
            const status = document.getElementById('ship-status');
            if (status) status.textContent = '⏳ Сохранение...';
            const token = localStorage.getItem('token');
            if (!token) {
                redirectToLogin();
                return;
            }
            fetch('/me/ship-icon', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ ship_icon: file })
            })
            .then(async res => {
                if (res.status === 401 || res.status === 403) {
                    redirectToLogin();
                    return;
                }
                if (!res.ok) {
                    let msg = 'Ошибка сохранения';
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                shipIcon = data.ship_icon;
                markSelectedShip();
                if (status) status.textContent = '✅ Иконка сохранена';
            })
            .catch(e => {
                if (status) status.textContent = '❌ ' + e.message;
            });
        }

        function selectColor(color) {
            shipColor = color;
            renderShipGrid(); // перекрасить превью сетки (лениво, кэш)
            markSelectedColor();
            const status = document.getElementById('ship-status');
            if (status) status.textContent = '⏳ Сохранение...';
            const token = localStorage.getItem('token');
            if (!token) {
                redirectToLogin();
                return;
            }
            fetch('/me/ship-color', {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': 'Bearer ' + token
                },
                body: JSON.stringify({ ship_color: color })
            })
            .then(async res => {
                if (res.status === 401 || res.status === 403) {
                    redirectToLogin();
                    return;
                }
                if (!res.ok) {
                    let msg = 'Ошибка сохранения';
                    try { msg = (await res.json()).error || msg; } catch (_) {}
                    throw new Error(msg);
                }
                const data = await res.json();
                shipColor = data.ship_color || null;
                renderShipGrid();
                markSelectedColor();
                if (status) status.textContent = '✅ Цвет сохранён';
            })
            .catch(e => {
                if (status) status.textContent = '❌ ' + e.message;
            });
        }

        async function loadShipSelector() {
            const token = localStorage.getItem('token');
            if (!token) return;
            try {
                const res = await fetch('/me', { headers: { 'Authorization': 'Bearer ' + token } });
                if (!res.ok) return;
                const data = await res.json();
                shipOptions = Array.isArray(data.ship_options) ? data.ship_options : [];
                if (data.ship_icon) shipIcon = data.ship_icon; // уже смапплено сервером
                shipColor = data.ship_color || null;
                renderShipGrid();
                renderPalette();
            } catch (e) {
                console.error(e);
            }
        }

        // Перерисовка превью после асинхронной загрузки спрайтов
        // (onload → scheduleRedraw → этот колбэк; паттерн из ship_sprites.js).
        setRedrawCallback(renderShipGrid);

        loadUser();
        loadShipSelector();
        loadEncyclopedia();

        // ==================== ВКЛАДКИ ДАШБОРДА ====================
        // Паттерн админки (web/static/js/admin/tabs.js): .tab-btn/.tab-pane,
        // активная вкладка в localStorage. Ключ dashboardActiveTab не
        // пересекается с adminActiveTab/token/shipIcon/shipColor/zorion.journal.
        // Вкладки только показывают/скрывают панели — все загрузки идут при
        // старте как раньше, ленивая загрузка не нужна.
        const DASHBOARD_TAB_KEY = 'dashboardActiveTab';

        function activateDashboardTab(tabId) {
            if (!document.getElementById(tabId)) {
                tabId = 'tab-ship';
            }
            document.querySelectorAll('.tab-btn').forEach(b =>
                b.classList.toggle('active', b.dataset.tab === tabId));
            document.querySelectorAll('.tab-pane').forEach(p =>
                p.classList.toggle('active', p.id === tabId));
            localStorage.setItem(DASHBOARD_TAB_KEY, tabId);
        }

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => activateDashboardTab(btn.dataset.tab));
        });

        activateDashboardTab(localStorage.getItem(DASHBOARD_TAB_KEY) || 'tab-ship');

        // Выход из аккаунта (мелкая правка 2026-09-17): чистим игровой
        // токен из localStorage и уходим на страницу входа. Игровой токен
        // ('token') не пересекается с админским ('adminToken').
        document.getElementById('logoutBtn').addEventListener('click', () => {
            localStorage.removeItem('token');
            localStorage.removeItem('shipIcon');
            localStorage.removeItem('shipColor');
            window.location.href = '/login-page';
        });
    </script>
</body>
</html>
