<!-- web/map.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zorion — Карта миров</title>
    <link rel="stylesheet" href="/static/css/map.css">
</head>
<body>
    <div id="header">
        <h1>🗺️ Карта миров</h1>
        <div style="margin-left:auto;">
            <span id="currentWorldLabel" style="margin-right:1rem;color:#94a3b8;">Текущий мир: <strong id="currentWorldName">—</strong></span>
            <button onclick="location.href='/'">🏠 Дашборд</button>
            <button onclick="location.href='/assignments'">📋 Контракты</button>
        </div>
    </div>
    <!-- --- ФИЛЬТРЫ КАРТЫ --- -->
    <div id="filters-bar">
        <div class="filter-group filter-search">
            <span class="filter-group-label">Поиск</span>
            <div class="search-wrap">
                <input type="text" id="entity-search" placeholder="Название объекта…" autocomplete="off" spellcheck="false">
                <div id="entity-search-results" class="search-dropdown" hidden></div>
            </div>
        </div>

        <div class="filter-divider" aria-hidden="true"></div>

        <div class="filter-group filter-flags">
            <span class="filter-group-label">Флаги</span>
            <label class="filter-chip" title="Только миры с планетами">
                <input type="checkbox" id="filter-has-planets">
                <span class="chip-icon">🪐</span>
                <span class="chip-text">Планеты</span>
            </label>
            <label class="filter-chip" title="Только миры с жизнью">
                <input type="checkbox" id="filter-life">
                <span class="chip-icon">🧬</span>
                <span class="chip-text">Жизнь</span>
            </label>
            <label class="filter-chip" title="Только обитаемые миры">
                <input type="checkbox" id="filter-habitable">
                <span class="chip-icon">🏠</span>
                <span class="chip-text">Обитаемые</span>
            </label>
        </div>

        <div class="filter-divider" aria-hidden="true"></div>

        <div class="filter-group filter-selects">
            <span class="filter-group-label">Тип планеты</span>
            <select id="filter-planet-type" title="Фильтр по типу планеты">
                <option value="">— Все типы —</option>
                <option value="землеподобная">🌍 Землеподобная</option>
                <option value="газовый гигант">☁️ Газовый гигант</option>
                <option value="пустынная">🏜️ Пустынная</option>
                <option value="ледяная">❄️ Ледяная</option>
                <option value="вулканическая">🌋 Вулканическая</option>
                <option value="океаническая">🌊 Океаническая</option>
                <option value="радиоактивная">☢️ Радиоактивная</option>
                <option value="стеклянная">💎 Стеклянная</option>
                <option value="металлическая">⚙️ Металлическая</option>
                <option value="органик">🌿 Органик</option>
                <option value="скалистая">🪨 Скалистая</option>
            </select>

            <span class="filter-group-label">Ресурс</span>
            <select id="filter-resource" title="Фильтр по категории ресурсов">
                <option value="">— Все ресурсы —</option>
                <option value="mineral">🪨 Минералы</option>
                <option value="organic">🌿 Органика</option>
                <option value="rare">⭐ Редкие</option>
                <option value="fuel">🔥 Топливо</option>
                <option value="water">💧 Вода</option>
                <option value="gas">💨 Газы</option>
            </select>
        </div>

        <div class="filter-divider" aria-hidden="true"></div>

        <div class="filter-group filter-actions">
            <span id="filter-count" class="filter-count" aria-live="polite"></span>
            <button id="reset-filters" class="btn-reset" title="Сбросить все фильтры">
                <span class="btn-icon">↺</span>
                <span class="btn-text">Сбросить</span>
            </button>
            <div id="filter-spinner" class="filter-spinner" aria-hidden="true"></div>
        </div>
    </div>
    <div id="flight-panel">
        <div class="fp-head">
            <span class="fp-title">🚀 Перелёт</span>
            <span id="flightTime">—</span>
        </div>
        <div class="fp-route">
            <span id="flightFrom">—</span>
            <span class="fp-arrow">→</span>
            <span id="flightTo">—</span>
        </div>
        <div class="fp-bar">
            <div id="flightBar"></div>
        </div>
    </div>
    <div id="canvas-wrapper">
        <canvas id="mapCanvas"></canvas>
        <div id="loading">⏳ Загрузка данных...</div>
        <div id="tooltip">
            <h3 id="tooltipName">—</h3>
            <p id="tooltipType">Тип: —</p>
            <p id="tooltipLevel">Уровень: —</p>
            <button id="tooltipFlyBtn">🚀 Лететь</button>
        </div>
        <div id="status-bar">Загрузка...</div>
        <div id="zoom-controls">
            <button id="zoomInBtn" data-tooltip="Приблизить">➕</button>
            <button id="zoomOutBtn" data-tooltip="Отдалить">➖</button>
            <button id="centerBtn" data-tooltip="Найти меня / следить за кораблём в полёте">🎯</button>
            <div id="zoom-info">100%</div>
        </div>
    </div>
    <script type="module" src="/static/js/main.js"></script>
</body>
</html>
