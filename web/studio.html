// --- редактор слотов родителя (спека 2026-09-21-скрытые §3.2) ---
// Скрытость живёт на СЛОТЕ родителя, не на записи (С6): галки «скрытая»
// расставляются из карточки типа kind=goods на текущем уровне расовости.

// prodSlotAppliesTo(s, p) — применим ли слот к уровню расовости ЗАПИСИ p
// (спека скрытых §2.1): универсальный слот (race_family IS NULL) — всем;
// семейный (race_family=Fk, race NULL) — записям с race_family=Fk (включая
// расовые записи семейства — у них race_family=Fk); расовый (race=R) —
// только записям с race=R.
function prodSlotAppliesTo(s, p) {
  if (!s.race_family) return true;
  if (s.race) return s.race === p.race;
  return s.race_family === p.race_family;
}

// prodCategoryOptions(p) — категории с применяемым слотом родителя на уровне
// расовости ЗАПИСИ p (её race_family/race, спека скрытых §3.4), не текущего
// уровня UI: универсальная запись при уровне UI «Семейство F4» видит
// универсальные/наследуемые слоты, семейная запись при «Универсальном» — свои
// (иначе 400 «категория не настроена у родителя на этом уровне», инвариант С4).
function prodCategoryOptions(p) {
  const t = state.producer_types.find(x => x.id === p.parent_id);
  if (!t) return '';
  const slots = prodSlots(t).filter(s => prodSlotAppliesTo(s, p));
  const catIDs = [...new Set(slots.map(s => s.category_id))];
  return catIDs.map(catID => {
    const c = state.categories.find(x => x.id === catID);
    if (!c) return '';
    return '<option value="' + c.id + '"' + (c.id === p.category_id ? ' selected' : '') + '>' + esc(c.name) + '</option>';
  }).join("");
}

// prodSlotEditor(t) — HTML секции «Слоты категорий» (редактор слотов):
// список категорий набора на текущем уровне с галками «скрытая», пометками
// «унаследован/переопределён», «− слот»; внизу «+ слот категории».
function prodSlotEditor(t) {
  const levelLabel = prodRaceLevel === "universal" ? "Универсальный (база)"
    : prodRaceLevel === "family" ? "Семейство " + familyLabelById(prodRaceFamily)
    : "Раса " + raceName(prodRace);
  const applied = prodAppliedSlots(t);
  const catIDs = [...new Set(applied.map(s => s.category_id))];
  let html = '<div class="usedin" style="margin-top:8px"><div class="usedin-h">Слоты категорий <span class="seg-sub">· ' + esc(levelLabel) + '</span></div>';
  if (!catIDs.length) {
    html += '<div class="empty-note">слотов нет — добавьте категории ниже</div>';
  } else {
    html += '<div class="prod-slots-list">';
    catIDs.forEach(catID => {
      const cat = state.categories.find(c => c.id === catID);
      if (!cat) return;
      const recs = applied.filter(s => s.category_id === catID);
      const most = prodMostSpecificSlot(recs);
      const own = recs.find(prodSlotOwned) || null; // слот текущего уровня (переопределение) / база на universal
      const base = recs.find(s => !s.race_family && !s.race) || null;
      const inherited = !own; // на universal own = база → переопределения нет
      // Обратный кейс (§3.2): скрытая база + видимое переопределение — хинт
      const baseHiddenHint = (base && own && own !== base && base.hidden && !own.hidden)
        ? '<span style="color:#777;font-size:10px"> база скрыта</span>' : '';
      const labelHtml = inherited
        ? '<span style="color:#777;font-size:10px">унаследован</span>'
        : '<span class="badge b-override">переопределён</span>';
      const removeBtn = own
        ? '<button onclick="removeProdSlot(' + t.id + ',' + catID + ')" title="' +
          (own.race_family ? 'снять переопределение' : 'убрать из набора родителя') + '">−</button>'
        : '';
      html += '<div class="pslot' + (most.hidden ? ' hidden' : '') + '">' +
        '<label style="font-size:12px"><input type="checkbox"' + (most.hidden ? ' checked' : '') +
        ' onchange="toggleProdSlot(' + t.id + ',' + catID + ',this.checked)" title="Не показывать категорию на этом уровне расовости"> скрытая</label>' +
        '<span class="cname" title="' + esc(cat.name) + '">' + esc(cat.name) + '</span>' + labelHtml + baseHiddenHint + removeBtn +
        '</div>';
    });
    html += '</div>';
  }
  // «+ слот категории»: категории ВНЕ набора на текущем уровне
  const free = state.categories.filter(c => !catIDs.includes(c.id));
  html += '<div class="addrow" style="margin-top:4px"><select id="prodNewSlotCat">' +
    (free.length ? free.map(c => '<option value="' + c.id + '">' + esc(c.name) + '</option>').join("") : '<option value="">нет свободных</option>') +
    '</select><button class="gen" onclick="addProdSlot(' + t.id + ')"' + (free.length ? '' : ' disabled') + '>+ слот</button></div>';
  html += '</div>';
  return html;
}

// toggleProdSlot — галка «скрытая» в редакторе (§3.2): собственный слот
// уровня → PUT {hidden}; унаследованный → создать переопределение уровня
// (POST) с новым значением (база не трогается).
async function toggleProdSlot(tid, catID, checked) {
  const t = state.producer_types.find(x => x.id === tid);
  if (!t) return;
  const applied = prodAppliedSlots(t);
  const recs = applied.filter(s => s.category_id === catID);
  const own = recs.find(prodSlotOwned) || null;
  if (own) {
    await api("PUT", "/studio/api/slots/" + own.id, {hidden: checked});
  } else {
    const body = {parent_id: tid, category_id: catID, hidden: checked};
    if (prodRaceLevel === "family") body.race_family = prodRaceFamily;
    if (prodRaceLevel === "race") { body.race_family = raceFamilyOf(prodRace); body.race = prodRace; }
    await api("POST", "/studio/api/slots", body);
  }
  fetchState();
}

// removeProdSlot — «− слот» (§3.2/§5.3): снятие переопределения уровня — без
// подтверждения (обратимо); удаление базового слота из набора родителя —
// подтверждение-модалка (RESTRICT 409 при заводах).
function removeProdSlot(tid, catID) {
  const t = state.producer_types.find(x => x.id === tid);
  if (!t) return;
  const recs = prodAppliedSlots(t).filter(s => s.category_id === catID);
  const own = recs.find(prodSlotOwned) || null;
  if (!own) return;
  if (!own.race_family && prodRaceLevel === "universal") {
    const cat = state.categories.find(c => c.id === catID);
    openModal(
      '<h3>Убрать категорию из набора</h3>' +
      '<div>Убрать «' + esc(cat ? cat.name : catID) + '» из набора родителя на универсальном уровне? Заводы категории останутся.</div>',
      [
        {label: "Убрать", cls: "del", primary: true, action: () => doRemoveProdSlot(own.id)},
        {label: "Отмена", cls: "", action: closeModal}
      ]
    );
    return;
  }
  doRemoveProdSlot(own.id); // снять переопределение уровня — обратимо
}
async function doRemoveProdSlot(slotId) {

// addProdSlot — «+ слот категории»: POST слот уровня/базы (категория вне

async function prodAdd() {

  const kind = $("prodNewKind").value;
  if (!name) return;
  // «+ тип» создаёт тип (parent_id NULL): категории у типов нет (спека
  // 2026-09-21 §1.2 п.4 — категории живут в подтипах, их заводят через
  // узлы-приглашения дерева на канвасе).

// ---------- дерево построек на канвасе (спека 2026-09-21 §2) ----------
// Уровни: Строения (корень) → Классы (фиксированные) → Типы (parent_id NULL)
// → Подтипы + узлы-приглашения категорий (автоматика). Раскладка — свой
// лейут (4 уровня-ряда), рёбра — орто (orthoEdge), pan/zoom — общие.

function raceFamilyOf(raceId) {
  if (!racesData) return "";
  const r = racesData.races.find(x => x.id === raceId);
  return r ? r.family : "";
}
function raceName(raceId) {
  if (!racesData) return raceId;
  const r = racesData.races.find(x => x.id === raceId);
  return r ? r.name : raceId;
}
function familyLabelById(fid) {
  if (!racesData) return fid;
  const f = racesData.families.find(x => x.id === fid);
  return f ? (f.id === "robotic" ? "F10 " + f.name : f.id + " " + f.name) : fid;
}

// Видимость записи при выбранном уровне расовости (спека §2.4, решение
// создателя идея §2 п.6 «своё + универсальное»): универсальный — race_family
// IS NULL; семейство Fk — NULL или Fk; раса R — NULL или (family(R) и race
// IS NULL) или race = R.
function prodVisible(p) {
  if (prodRaceLevel === "universal") return !p.race_family;
  if (prodRaceLevel === "family") return !p.race_family || p.race_family === prodRaceFamily;
  const fam = raceFamilyOf(prodRace);
  return !p.race_family || (p.race_family === fam && !p.race) || p.race === prodRace;
}

// Применяемые записи узла (тип t, категория catID — ЧИСЛО id категории) на
// текущем уровне расовости (спека дерева §2.4): подтипы с parent_id=t.id и
// category_id=catID, видимые по prodVisible.
function prodAppliedRecords(t, catID) {
  return state.producer_types.filter(s => s.parent_id === t.id && s.category_id === catID && prodVisible(s));
}

// --- слоты родителя (спека 2026-09-21-скрытые-категории-строений §2) ---
// Слот = «родитель предлагает категорию на уровне расовости»; конфигурация
// типа kind=goods. Дерево строит категории ИЗ СЛОТОВ (автоматика по имени
// типа удалена, §2.3); скрытость живёт на слоте (одна ось).

// prodSlots(t) — все слоты типа t (конфигурация, без фильтра расовости).
function prodSlots(t) {
  return state.producer_slots.filter(s => s.parent_id === t.id);
}
// prodSlotVisible(s) — применим ли слот на текущем уровне расовости (§2.1,
// та же логика, что prodVisible у записей): универсальный — race_family IS
// NULL; семейство Fk — NULL или Fk; раса R — NULL или (family(R), race NULL)
// или race=R.
function prodSlotVisible(s) {
  if (prodRaceLevel === "universal") return !s.race_family;
  if (prodRaceLevel === "family") return !s.race_family || s.race_family === prodRaceFamily;
  const fam = raceFamilyOf(prodRace);
  return !s.race_family || (s.race_family === fam && !s.race) || s.race === prodRace;
}
function prodSlotSpecificity(s) {
  if (s.race) return 2;
  if (s.race_family) return 1;
  return 0;
}
// prodAppliedSlots(t) — применяемые слоты типа на текущем уровне (§2.1).
function prodAppliedSlots(t) {
  return prodSlots(t).filter(prodSlotVisible);
}
// prodMostSpecificSlot(applied) — самая конкретная применяемая запись
// (race > family > universal); UNIQUE NULLS NOT DISTINCT гарантирует
// однозначность на уровне.
function prodMostSpecificSlot(applied) {
  return applied.reduce((a, b) => prodSlotSpecificity(b) > prodSlotSpecificity(a) ? b : a);
}
// prodSlotOwned(s) — слот принадлежит ТЕКУЩЕМУ уровню расовости (не наследуется).
function prodSlotOwned(s) {
  if (prodRaceLevel === "universal") return !s.race_family;
  if (prodRaceLevel === "family") return s.race_family === prodRaceFamily && !s.race;
  return s.race === prodRace;
}
// prodCatInSet(t, catID) — категория входит в набор родителя на уровне
// (есть применяемый слот). Вне набора категория не рисуется вовсе (§2.1).
function prodCatInSet(t, catID) {
  return prodAppliedSlots(t).some(s => s.category_id === catID);
}
// prodCatHidden(t, catID) — категория скрыта на уровне (самая конкретная
// применяемая запись hidden=true, вариант б, §2.1). Вне набора — false
// (отсутствует, не «скрыта»).
function prodCatHidden(t, catID) {
  const applied = prodAppliedSlots(t).filter(s => s.category_id === catID);
  if (!applied.length) return false;
  return prodMostSpecificSlot(applied).hidden;
}

// prodNodeVisible(p) — рисуется ли узел записи p в дереве при текущем уровне
// расовости и галке (спека скрытых §2.2/§3.5): категория записи входит в
// набор родителя (слот-управляемый) и не скрыта (или галка включена).
// Типы items/energy без слотов — без оси скрытости.
function prodNodeVisible(p) {
  if (!p.parent_id) return true; // типы не скрываются (§1.4 п.1)
  const t = state.producer_types.find(x => x.id === p.parent_id);
  if (!t || t.kind !== "goods") return true; // items/energy — как раньше
  if (!prodCatInSet(t, p.category_id)) return false; // категория вне набора уровня
  if (prodCatHidden(t, p.category_id) && !prodShowHidden) return false; // скрыта, галки нет
  return true;
}

// prodNodeId — id узла дерева для записи producer_types ("type:N"/"sub:N").
function prodNodeId(p) { return (p.parent_id ? "sub:" : "type:") + p.id; }
// prodNodeById — запись по id узла дерева (null для фиксированных/приглашений).
function prodNodeById(id) {
  const m = /^(type|sub):(\d+)$/.exec(id || "");
  if (!m) return null;
  return state.producer_types.find(p => p.id === Number(m[2]));
}

// buildProdTree — дерево построек (спека §2.1 + скрытые §2.1/§2.2): корень →
// классы (фиксированные узлы UI, не записи БД) → типы (parent_id NULL, по
// классам через kind) → подтипы + узлы-приглашения. Тип kind=goods раскрывает
// категории ИЗ СЛОТОВ родителя (применяемые на уровне): вне набора — не
// рисуется; скрытая категория — state 2 (без галки ничего, с галкой —
// затемнённые карточки записей или заглушка); видимая — карточки записей +
// приглашение, если записей нет. Типы items/energy — подтипы как раньше
// (по prodVisible), без оси скрытости.
function buildProdTree() {
  const classes = [
    {id: "class-goods", label: "Производители товаров", cls: "goods", children: []},
    {id: "class-items", label: "Производители предметов", cls: "items", children: []},
    {id: "class-energy", label: "Производители энергии", cls: "energy", children: []},
    {id: "class-other", label: "Другие", cls: "other", children: []},
  ];
  const root = {id: "root", label: "Строения", kind: "root", children: classes};
  const types = state.producer_types.filter(p => !p.parent_id && prodVisible(p));
  const subtypeNode = (s, isHidden) => ({id: prodNodeId(s), label: s.name, kind: "subtype", ref: s, children: [], hidden: isHidden});
  types.forEach(t => {
    const cls = classes.find(c => c.cls === t.kind);
    if (!cls) return;
    const node = {id: prodNodeId(t), label: t.name, kind: "type", ref: t, children: []};
    cls.children.push(node);
    if (t.kind === "goods") {
      // Слоты родителя (спека скрытых §2.1/§2.2): категории = применяемые
      // слоты на текущем уровне; вне набора — категория не рисуется вовсе.
      const applied = prodAppliedSlots(t);
      const catIDs = [...new Set(applied.map(s => s.category_id))];
      catIDs.forEach(catID => {
        const cat = state.categories.find(c => c.id === catID);
        if (!cat) return;
        const recs = applied.filter(s => s.category_id === catID);
        const most = prodMostSpecificSlot(recs);
        const records = state.producer_types.filter(s => s.parent_id === t.id && s.category_id === catID && prodVisible(s));
        if (most.hidden) {
          // state 2 «скрыто»: без галки ничего; с галкой — затемнённые карточки
          // записей категории; записей нет — карточка-заглушка категории (§2.2 п.2)
          if (!prodShowHidden) return;
          if (!records.length) {
            node.children.push({id: "hstub:" + t.id + ":" + catID, label: cat.name, kind: "hiddenStub", ref: {type: t, catID}, children: []});
          } else {
            records.forEach(s => node.children.push(subtypeNode(s, true)));
          }
        } else {
          // видимо: карточки записей «своё + универсальное» + приглашение,
          // если записей нет (§2.2 п.1/п.3)
          if (!records.length) {
            node.children.push({id: "invite:" + t.id + ":" + catID, label: cat.name, kind: "invite", ref: {type: t, cat}, children: []});
          } else {
            records.forEach(s => node.children.push(subtypeNode(s, false)));
          }
        }
      });
      // записи подтипов с категорией ВНЕ набора уровня не рисуются (§2.1)
    } else {
      // Типы items/energy: подтипы как раньше (по prodVisible), без оси
      // скрытости (§3.3; у записей hidden снят).
      state.producer_types.filter(s => s.parent_id === t.id && prodVisible(s)).forEach(s => {
        node.children.push(subtypeNode(s, false));
      });
    }
  });
  return root;
}

// prodTreeLayout — раскладка дерева (4 уровня-ряда, как computeLayout):
// ширина поддерева = сумма детей, родитель центрируется над детьми.
function prodTreeLayout() {
  const root = buildProdTree();
  const cols = {};
  function colsOf(n) {
    if (cols[n.id] !== undefined) return cols[n.id];
    if (!n.children.length) { cols[n.id] = 1; return 1; }
    let s = 0;
    n.children.forEach(c => s += colsOf(c));
    cols[n.id] = s;
    return s;
  }
  const pos = {};
  let maxCols = 1;
  const rowH = CARD_H + ROW_GAP;
  function place(n, x, depth) {
    const blockW = colsOf(n) * (CARD_W + GAP_X) - GAP_X;
    pos[n.id] = {x: x + (blockW - CARD_W) / 2, y: PAD + depth * rowH};
    maxCols = Math.max(maxCols, x + blockW + GAP_X);
    let cx = x;
    n.children.forEach(c => { place(c, cx, depth + 1); cx += colsOf(c) * (CARD_W + GAP_X); });
  }
  place(root, PAD, 0);
  return {root, pos, maxCols};
}

// renderProdTree — дерево построек на канвасе (спека §2.5): карточки уровней,
// орто-рёбра, узлы-приглашения пунктиром, клик = выбор, двойной клик = попап.
function renderProdTree() {
  const dpr = window.devicePixelRatio || 1;
  const cssW = $("canvasWrap").clientWidth, cssH = $("canvasWrap").clientHeight;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * panX, dpr * panY);
  ctx.clearRect(-panX/zoom, -panY/zoom, cssW/zoom, cssH/zoom);
  const L = prodTreeLayout();
  // рёбра (орто)
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1.5;
  (function edges(n) {
    n.children.forEach(c => {
      if (L.pos[c.id]) orthoEdge(L.pos[n.id], L.pos[c.id]);
      edges(c);
    });
  })(L.root);
  // карточки
  (function draw(n) {
    const p = L.pos[n.id];
    if (!p) return;
    const x = p.x, y = p.y;
    const isInvite = n.kind === "invite";
    const isFixed = n.kind === "root" || n.kind === "class";
    const sel = selected === n.id;
    if (isInvite) {
      ctx.setLineDash([5, 4]);
      ctx.fillStyle = "#1a1a1a";
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 1.5;
      roundRect(x, y, CARD_W, CARD_H, 8);
      ctx.fill(); ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = "#999";
      ctx.font = "12px Arial";
      ctx.fillText("создать", x + 8, y + 18);
      ctx.font = "10px Arial";
      ctx.fillText(trunc(n.label, 24), x + 8, y + 32);
    } else if (n.kind === "hiddenStub") {
      // Карточка-заглушка скрытой пустой категории (спека скрытых §2.2 п.2):
      // сплошная затемнённая карточка, подпись «нет заводов», бейдж «скрыта»;
      // клик/двойной клик открывает карточку родителя (§3.2, путь «открыть»).
      ctx.fillStyle = "#3a3a3a";
      ctx.strokeStyle = sel ? "#8cf" : "#4a4a4a";
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(x, y, CARD_W, CARD_H, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = "#ddd";
      ctx.font = "12px Arial";
      ctx.fillText(trunc(n.label, 26), x + 8, y + 18);
      ctx.fillStyle = "#888";
      ctx.font = "10px Arial";
      ctx.fillText("нет заводов", x + 8, y + 32);
      const b = "скрыта";
      const w = ctx.measureText(b).width + 10;
      ctx.fillStyle = "#333";
      roundRect(x + 8, y + 40, w, 16, 4); ctx.fill();
      ctx.fillStyle = "#aaa";
      ctx.fillText(b, x + 13, y + 52);
    } else {
      const isHidden = !!n.hidden;
      // Скрытая запись (спека скрытых §3.4): затемнение ЦВЕТАМИ (fill/border/
      // имя/подпись), не globalAlpha — выделение #8cf остаётся ярким.
      ctx.fillStyle = isFixed ? "#2a2a2a" : isHidden ? "#3a3a3a" : (n.ref && n.ref.status === "banned" ? "#3a3a3a" : "#3d3d3d");
      ctx.strokeStyle = sel ? "#8cf" : (isFixed ? "#666" : isHidden ? "#4a4a4a" : "#5a5a5a");
      ctx.lineWidth = sel ? 2 : 1;
      roundRect(x, y, CARD_W, CARD_H, 8);
      ctx.fill(); ctx.stroke();
      ctx.fillStyle = isHidden ? "#ddd" : "#fff";
      ctx.font = "12px Arial";
      ctx.fillText(trunc(n.label, 26), x + 8, y + 18);
      ctx.fillStyle = isHidden ? "#888" : "#bbb";
      ctx.font = "10px Arial";
      const sub = n.kind === "type" ? kindLabel(n.ref.kind)
        : n.kind === "subtype" ? (n.ref.category_name || kindLabel(n.ref.kind))
        : (n.id === "class-other" ? "задел" : "фиксированный класс");
      ctx.fillText(sub, x + 8, y + 32);
      // бейджи (статус + «скрыта») — ряд на y+40 (паттерн статусных бейджей,
      // measureText+10, radius 4)
      let bx = x + 8;
      if (n.ref && n.ref.status) {
        const b = statusLabel(n.ref.status);
        const w = ctx.measureText(b).width + 10;
        ctx.fillStyle = statusColor(n.ref.status);
        roundRect(bx, y + 40, w, 16, 4); ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.fillText(b, bx + 5, y + 52);
        bx += w + 4;
      }
      if (isHidden) {
        const b = "скрыта";
        const w = ctx.measureText(b).width + 10;
        ctx.fillStyle = "#333";
        roundRect(bx, y + 40, w, 16, 4); ctx.fill();
        ctx.fillStyle = "#aaa";
        ctx.fillText(b, bx + 5, y + 52);
      }
    }
    n.children.forEach(draw);
  })(L.root);
}

// prodTreeHitTest — карточка дерева под точкой (мировые координаты).
function prodTreeHitTest(mx, my) {
  const L = prodTreeLayout();
  for (const id in L.pos) {
    const p = L.pos[id];
    if (mx >= p.x && mx <= p.x + CARD_W && my >= p.y && my <= p.y + CARD_H) return {type: "card", id: id};
  }
  return null;
}

// openProdNodePopup — попап по узлу дерева (спека §2.5): тип/подтип — деталь
// (renderProdPopup); узел-приглашение — попап создания; фиксированный узел
// (корень/класс) — справка «фиксированный узел», «Другие» — пометка «задел».
function openProdNodePopup(id) {
  const n = prodNodeById(id);
  if (n) { openProdPopup(n.id); return; }
  if (id && id.indexOf("invite:") === 0) { openProdCreatePopup(id); return; }
  // Заглушка скрытой пустой категории (спека скрытых §2.2 п.2): клик →
  // карточка родителя (путь «открыть» скрытую категорию, §3.2).
  if (id && id.indexOf("hstub:") === 0) {
    const parts = id.split(":");
    const t = state.producer_types.find(x => x.id === Number(parts[1]));
    if (t) {
      selected = prodNodeId(t);
      openProdPopup(t.id);
      renderAll();
      centerOn(selected);
    }
    return;
  }
  const label = id === "root" ? "Строения"
    : id === "class-other" ? "Другие"
    : id === "class-goods" ? "Производители товаров"
    : id === "class-items" ? "Производители предметов" : "Производители энергии";
  openModal(
    '<h3>' + esc(label) + '</h3>' +
    '<div>' + (id === "class-other" ? 'Задел — типы появятся позже.' : 'Фиксированный узел дерева построек (не редактируется).') + '</div>',

}

// openProdCreatePopup — попап создания подтипа из узла-приглашения (спека
// §2.3): name = «<Родитель> <категория>», kind/category_id/parent_id — из
// узла, race_family/race — текущий уровень расовости. POST → draft.
function openProdCreatePopup(id) {
  const m = /^invite:(\d+):(\d+)$/.exec(id || "");
  if (!m) return;
  const type = state.producer_types.find(p => p.id === Number(m[1]));
  const cat = state.categories.find(c => c.id === Number(m[2]));
  if (!type || !cat) return;
  const raceInfo = prodRaceLevel === "universal" ? ""
    : prodRaceLevel === "family" ? familyLabelById(prodRaceFamily) : raceName(prodRace);
  openModal(
    '<h3>Создать подтип</h3>' +
    '<div>Родитель: <b>' + esc(type.name) + '</b> · категория: <b>' + esc(cat.name) + '</b>' +
    (raceInfo ? ' · расовость: <b>' + esc(raceInfo) + '</b>' : '') + '</div>' +
    '<div style="margin-top:8px">Имя: <input id="prodCreateName" type="text" value="' + esc(type.name + " " + cat.name) + '" style="width:100%;box-sizing:border-box" autocomplete="off"></div>',
    [
      {label: "Создать", cls: "gen", primary: true, action: () => doProdCreate(type, cat)},
      {label: "Отмена", cls: "", action: closeModal}
    ]
  );
  const inp = $("prodCreateName");
  inp.focus(); inp.select();
  // Enter — глобальный обработчик модалки (клик по primary-кнопке «Создать»).
}
async function doProdCreate(type, cat) {
  const name = $("prodCreateName").value.trim();
  if (!name) return;
  closeModal();
  const body = {name, kind: type.kind, category_id: cat.id, parent_id: type.id};
  if (prodRaceLevel === "family") body.race_family = prodRaceFamily;
  if (prodRaceLevel === "race") { body.race_family = raceFamilyOf(prodRace); body.race = prodRace; }
  const r = await api("POST", "/studio/api/producers", body);
  if (!r) return;
  const p = await r.json();
  selected = prodNodeId(p);
  fetchState();
}

// --- переключатель уровня расовости (спека §5) ---
// Универсальный / Семейство (F0–F10) / Раса (60, сгруппированы по семействам).
// Выбор расы фиксирует её семейство (каскад), выбор семейства сбрасывает расу.
function setProdRaceLevel(v) {
  prodRaceLevel = v;
  localStorage.setItem("gs_prodRaceLevel", v);
  if (v === "universal") { prodRaceFamily = ""; prodRace = ""; }
  if (v === "family") prodRace = "";
  localStorage.setItem("gs_prodRaceFamily", prodRaceFamily);
  localStorage.setItem("gs_prodRace", prodRace);
  renderProdRaceUI();
  renderAll();
}
function setProdRaceFamily(v) {
  prodRaceFamily = v;
  prodRace = ""; // выбор семейства сбрасывает расу (спека §5)
  localStorage.setItem("gs_prodRaceFamily", v);
  localStorage.setItem("gs_prodRace", "");
  renderProdRaceUI();
  renderAll();
}
function setProdRace(v) {
  prodRace = v;
  if (v) {
    const fam = raceFamilyOf(v);
    if (fam) { prodRaceFamily = fam; localStorage.setItem("gs_prodRaceFamily", fam); }
  }
  localStorage.setItem("gs_prodRace", v);
  renderProdRaceUI();
  renderAll();
}
function renderProdRaceUI() {
  const levelSel = $("prodRaceLevelSel");
  const famSel = $("prodRaceFamilySel");
  const raceSel = $("prodRaceSel");
  if (!levelSel) return;
  levelSel.value = prodRaceLevel;
  famSel.innerHTML = (racesData ? racesData.families : []).map(f =>
    '<option value="' + f.id + '"' + (f.id === prodRaceFamily ? ' selected' : '') + '>' + esc(familyLabelById(f.id)) + '</option>').join("");
  raceSel.innerHTML = prodRaceOptions(prodRace);
  famSel.style.display = prodRaceLevel === "universal" ? "none" : "";
  raceSel.style.display = prodRaceLevel === "race" ? "" : "none";
}
function prodRaceOptions(sel) {
  if (!racesData) return '<option value="">—</option>';
  const byFam = {};
  racesData.races.forEach(r => { (byFam[r.family] = byFam[r.family] || []).push(r); });
  let html = '<option value="">—</option>';
  racesData.families.forEach(f => {
    const list = byFam[f.id] || [];
    if (!list.length) return;
    html += '<optgroup label="' + esc(familyLabelById(f.id)) + '">' +
      list.map(r => '<option value="' + r.id + '"' + (r.id === sel ? ' selected' : '') + '>' + esc(r.name) + '</option>').join("") +
      '</optgroup>';
  });
  return html;
}
async function fetchRaces() {
  try {
    const r = await studioFetch("/studio/api/races");
    if (!r.ok) return;
    racesData = await r.json();
    racesLoaded = true;
    renderProdRaceUI();
    renderAll();
  } catch (e) { /* 401 — оверлей уже показан (studioFetch) */ }
}

// showProdTip — тултип узла дерева построек.
function showProdTip(ev, id) {
  const n = prodNodeById(id);
  const tip = $("tip");
  if (n) {
    const t = n.parent_id ? state.producer_types.find(x => x.id === n.parent_id) : null;
    const catHidden = !!(t && t.kind === "goods" && prodCatHidden(t, n.category_id));
    tip.innerHTML = '<b>' + esc(n.name) + '</b><br>' + esc(kindLabel(n.kind)) + ' · ' + esc(statusLabel(n.status)) +
      (n.category_name ? ' · ' + esc(n.category_name) : '') + (n.parent_name ? ' · ← ' + esc(n.parent_name) : '') +
      (catHidden ? '<br><span style="color:#aaa">скрыта</span>' : '');
  } else if (id === "root") {
    tip.innerHTML = '<b>Строения</b><br>корень дерева построек';
  } else if (id === "class-other") {
    tip.innerHTML = '<b>Другие</b><br>задел — типы появятся позже';
  } else if (id && id.indexOf("class-") === 0) {
    tip.innerHTML = '<b>' + esc(id === "class-goods" ? "Производители товаров" : id === "class-items" ? "Производители предметов" : "Производители энергии") + '</b><br>фиксированный класс';
  } else if (id && id.indexOf("invite:") === 0) {
    tip.innerHTML = '<b>создать</b><br>подтип не заведён — клик создаст';
  } else if (id && id.indexOf("hstub:") === 0) {
    const parts = id.split(":");
    const cat = state.categories.find(c => c.id === Number(parts[2]));
    tip.innerHTML = '<b>' + esc(cat ? cat.name : "категория") + '</b><br>скрытая категория · нет заводов — клик откроет карточку родителя';
  } else {
    hideTip(); return;
  }
  const rect = canvas.getBoundingClientRect();
  let x = ev.clientX - rect.left + 14, y = ev.clientY - rect.top + 14;
  if (x + 220 > rect.width) x = ev.clientX - rect.left - 230;
  if (y + 60 > rect.height) y = ev.clientY - rect.top - 60;
  tip.style.left = x + "px"; tip.style.top = y + "px";
  tip.style.display = "block";
}

function startItemRename() {

async function saveItemJSON() {
  const body = {};
  const fields = [["unlocks", "itemUnlocks"], ["params", "itemParams"]];
  for (const [key, elId] of fields) {
    const v = $(elId).value.trim();
    if (v === "") { body[key] = null; continue; }
    try { JSON.parse(v); } catch (e) { showReport(["ошибка: " + key + " — невалидный JSON"]); return; }
    body[key] = v;
  }
  const r = await api("PUT", "/studio/api/items/" + popupGoodId, body);
  if (r) fetchState();

// подгрузка списка (99a.3 §8.5): POST /api/goods/bulk → тост-отчёт по строкам
async function bulkCreate() {
  const lines = $("bulkText").value.split("\n");
  const r = await api("POST", "/studio/api/goods/bulk", {lines});
  if (!r) return;
  const out = await r.json();
  const lines2 = ["Создано " + (out.created || []).length + ", пропущено " + (out.skipped || []).length + ", ошибок " + (out.errors || []).length];
  (out.skipped || []).forEach(s => lines2.push("строка " + s.line + ": " + s.reason + (s.name ? " («" + s.name + "»)" : "")));
  (out.errors || []).forEach(e => lines2.push("строка " + e.line + ": " + e.reason));
  showReport(lines2);
  $("bulkText").value = "";
  fetchState();
}

// ---------- оверлеи состояний ----------
function updateOverlays() {
  $("loadingOverlay").style.display = loading ? "flex" : "none";
  $("right").classList.toggle("disabled", loading);
  const empty = !loading && state.goods.length === 0;
  // оверлеи канваса — только ветка «Товары» (производители/предметы — списки)
  $("emptyOverlay").style.display = (branch === "goods" && empty) ? "flex" : "none";
  // фокус-режим без выбора: «Кликните товар в справочнике» (99a.3 §5.3)
  const focusEmpty = !loading && !empty && branch === "goods" && !fullTreeMode() && !selected;
  $("focusEmptyOverlay").style.display = focusEmpty ? "flex" : "none";
  const noRes = !loading && !empty && branch === "goods" && fullTreeMode() && visibleGoods().length === 0;
  $("noResultsOverlay").style.display = noRes ? "flex" : "none";
  $("offlinePill").style.display = offline ? "block" : "none";
}
function focusNewGood() { $("spravNewName").focus(); } // «+ товар» в оверлее «Реестр пуст» → addrow справочника (addbar удалён, 99a.3-ui §13)

// ---------- режимы канваса (99a.3 §10.1 / 99a.3-ui §3.4) ----------
// В фокус-режиме скрыты: поиск по графу, фильтр категорий, «показать ресурсы»,
// «забаненные», «обратные рёбра», «⟲ на верхний тир». В «всё дерево» — видны.
function applyModeUI() {
  const full = fullTreeMode();
  $("search").style.display = full ? "" : "none";
  $("catFilter").style.display = full ? "" : "none";
  $("showResources").parentElement.style.display = full ? "" : "none";
  $("showBanned").parentElement.style.display = full ? "" : "none";
  $("reverseEdges").parentElement.style.display = full ? "" : "none";
  $("btnTop").style.display = full ? "" : "none";
  $("modeBadge").textContent = full ? "всё дерево" : "фокус: вокруг выбранного";
}

// ---------- сборка ----------
function renderAll() {
  // выбранный узел удалён (авто-обновление/импорт) → сброс к пустому состоянию
  if (selected) {
    if (branch === "goods" && !state.goods.some(g => g.id === selected)) selected = null;
    if (branch === "producers" && !prodNodeById(selected)) selected = null;
  }
  const sc = $("spravList").scrollTop; // сохранить scroll списка справочника при пересборке
  applyBranchUI();
  if (branch === "goods") {
    renderGraph();
    renderPopup();
    renderCatPopup(); // авто-обновление попапа категорий (если открыт)
    renderSprav();
    renderCatSelects();
  } else if (branch === "producers") {
    renderGraph(); // дерево построек на канвасе (спека 2026-09-21 §2)
    renderProdPopup(); // попап производителя (если открыт)
    renderSprav(); // список справочника — вспомогательный (§2.5)
  } else {
    renderSprav();
  }
  updateOverlays();
  applyModeUI();
  $("spravList").scrollTop = sc;
}

  // вид канваса по ветке: дерево построек — свой zoom/pan (спека §2.5)
  if (b === "producers") {

  centerTop(); // пересчёт размеров канваса + перерисовка
}
