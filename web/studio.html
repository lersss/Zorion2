<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<title>Студия товаров Zorion</title>
<style>
body{background:#111;color:#e8e8e8;font-family:Arial;margin:0;padding:8px 12px;height:100vh;box-sizing:border-box;display:flex;flex-direction:column;overflow:hidden;position:relative}
 h1{font-size:18px;margin:0 12px 0 0}
 h3{font-size:13px;color:#8cf;margin:10px 0 4px}
 .headbar{display:flex;flex-direction:column;gap:4px;margin-bottom:6px;margin-right:320px}
  .head-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .head-title{justify-content:space-between}
  .head-status{display:flex;gap:12px;align-items:center}
  .tool-seg{display:inline-flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px 8px;border-radius:8px;background:#1d1d1d;border:1px solid #333}
  .seg-label{font-size:11px;color:#888;letter-spacing:.5px;text-transform:uppercase;white-space:nowrap}
  .seg-sub{font-size:11px;color:#666;white-space:nowrap}
  .seg-body{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
  .tool-seg input,.tool-seg select{background:#222;border:1px solid #444;color:#ddd;padding:5px;border-radius:6px}
  details.tool-seg summary{list-style:none;cursor:pointer}
  details.tool-seg summary::-webkit-details-marker{display:none}
  details.tool-seg[open] summary{margin-bottom:2px}
 button{border:none;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;color:#ddd;background:#333}
 button:hover{background:#3a3a3a}
 button:active{background:#444}
 button:disabled{opacity:.45;cursor:not-allowed}
 button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #8cf;outline-offset:1px}
 .gen{background:#26a;color:#fff}
 .gen:hover{background:#37b}
 .warn{background:#a62;color:#fff}
 .warn:hover{background:#b73}
 .del{background:#a33;color:#fff}
 .del:hover{background:#b44}
 .ok{background:#2a7;color:#fff}
 .ok:hover{background:#3a8}
#modelInfo{color:#8cf;font-size:13px}
  #genIndicator{font-size:13px;color:#fa0}
  #main{flex:1;min-height:0;position:relative;display:block}
  #canvasWrap{position:absolute;left:0;top:0;bottom:0;right:320px;background:#101010;border:1px solid #3a3a3a;border-radius:8px;overflow:hidden}
  #canvasWrap.expanded{right:0} /* панель свёрнута — канвас на всю ширину (создатель 2026-09-19) */
  canvas{display:block;width:100%;height:100%;cursor:grab}
  /* правая колонка — от верха страницы на всю высоту (вне #main, absolute в body) */
  #right{position:absolute;top:0;right:0;bottom:0;width:320px;box-sizing:border-box;background:#181818f2;border-left:1px solid #444;border-radius:0 8px 8px 0;padding:10px;z-index:8;box-shadow:-4px 0 12px #0008;transition:transform .2s;display:flex;flex-direction:column;overflow:hidden}
  #right.collapsed{transform:translateX(100%);box-shadow:none}
  #panelToggle{position:absolute;top:8px;right:8px;z-index:9;background:#2b2b2b;border:1px solid #4a4a4a;color:#ddd;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  #right.disabled{opacity:.5;pointer-events:none}
  #sprav{display:flex;flex-direction:column;flex:1;min-height:0}
  /* шапка справочника фиксированная (не скроллится); скроллится только #spravList
     (требование создателя 2026-09-19: «Справочник снова скроллится») */
  .sprav-head{flex-shrink:0}
  #sprav .filters{font-size:12px;margin-bottom:6px;display:flex;flex-wrap:wrap;gap:2px 8px}
  #sprav .filters label{cursor:pointer;color:#bbb}
  #sprav .filters input{margin-right:3px;vertical-align:middle}
  /* пилюли-фильтры тиров (99a.3-ui §5.3): без подписи, выбор = акцент */
  .tierf{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
  .pill{display:inline-block;font-size:11px;background:#222;border:1px solid #444;color:#ddd;border-radius:10px;padding:1px 8px;cursor:pointer;user-select:none}
  .pill:hover{background:#2b2b2b}
  .pill.on{background:#26a;border-color:#26a;color:#fff}
  #spravList{flex:1;min-height:0;overflow-y:auto}
.card{background:#2b2b2b;border:1px solid #4a4a4a;border-radius:8px;padding:8px;margin-bottom:8px;cursor:grab}
  .card:hover{background:#363636;border-color:#5a5a5a}
  .card:active{background:#404040}
 .card .nm{font-size:13px;color:#eee;word-break:break-word}
 .card .meta{font-size:11px;color:#999;margin-top:2px}
 .badge{display:inline-block;font-size:10px;border-radius:4px;padding:1px 5px;margin-right:4px}
 .b-approved{background:#2a7;color:#fff}
 .b-draft{background:#a62;color:#fff}
 .b-excluded{background:#a33;color:#fff}
 .b-banned{background:#555;color:#ccc}
  .b-hidden{background:#333;color:#aaa} /* бейдж «скрыта» (спека скрытых §3.3) */
  .b-override{background:#26a;color:#fff} /* бейдж «переопределён» (редактор слотов, §3.2) */
  /* редактор слотов родителя (спека скрытых §3.2): список категорий набора */
  .prod-slots-list{max-height:200px;overflow-y:auto;border:1px solid #333;border-radius:6px;padding:4px 6px;margin:4px 0 6px}
  .pslot{display:flex;align-items:center;gap:8px;padding:4px 4px;border-radius:6px;font-size:12px}
  .pslot:hover{background:#242424}
  .pslot.hidden{background:#222}
  .pslot.hidden .cname{color:#999} /* скрытая строка — фон/имя, БЕЗ opacity: галка кликабельна */
  .pslot .cname{flex:1;min-width:0;color:#ddd;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pslot button{background:none;border:none;color:#999;cursor:pointer;font-size:13px;padding:2px 4px;min-width:24px;min-height:24px;border-radius:4px}
  .pslot button:hover{background:#333;color:#f66}
 .b-resource{background:#26a;color:#fff}
 .b-tier{background:#444;color:#ddd}
.popup-body .dname{font-size:15px;color:#fff;margin-bottom:4px}
  .popup-body .dname .rename{cursor:pointer;border-bottom:1px dashed #555}
  .popup-body .dname .rename:hover{color:#8cf;border-bottom-color:#8cf}
  .popup-body .dmeta{font-size:12px;color:#999;margin-bottom:8px}
  .popup-body .dmeta select{background:#222;border:1px solid #444;color:#ddd;padding:3px;border-radius:6px;font-size:12px}
.slot{background:#262626;border:1px solid #4a4a4a;border-radius:6px;padding:6px;margin-bottom:6px;min-height:28px;font-size:12px}
  .slot.empty{border-style:dashed;color:#999}
 .slot.drop-target{border-color:#8cf;background:#1e2a3a;box-shadow:0 0 0 1px #8cf}
 .slot .sname{color:#8cf}
 .slot .sreason{color:#777;font-size:11px;margin-top:2px}
 .slot .allowres{display:block;margin-top:4px;font-size:11px;color:#999;cursor:pointer}
 .slot .allowres input{margin-right:4px;vertical-align:middle}
 .slot button{float:right;background:#a33;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:11px;padding:2px 6px;min-width:24px;min-height:24px;margin-left:4px}
 .slot button.delslot{background:#555}
 .slot button.delslot:hover{background:#666}
.popup-body .btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
  .popup-body .btns button{border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer}
 .usedin{margin-top:10px;border-top:1px solid #333;padding-top:8px}
 .usedin-h{font-size:12px;color:#8cf;margin-bottom:4px}
 .usedin-item{font-size:12px;color:#ddd;padding:3px 6px;border-radius:4px;cursor:pointer}
 .usedin-item:hover{background:#242424;color:#8cf}
 #report{position:fixed;bottom:10px;right:10px;max-width:420px;background:#1c1c1c;border:1px solid #555;border-radius:8px;padding:10px;font-size:12px;color:#fa0;display:none;z-index:10}
 #report .rline{margin:2px 0}
 .hint{color:#666;font-size:11px;margin-top:4px}
 .empty-note{color:#666;font-size:12px;padding:6px}
 .overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#161616cc;color:#ddd;font-size:14px;z-index:5;text-align:center}
 .spinner{width:28px;height:28px;border:3px solid #333;border-top-color:#8cf;border-radius:50%;animation:spin .8s linear infinite}
 @keyframes spin{to{transform:rotate(360deg)}}
 #offlinePill{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#a62;color:#fff;padding:6px 12px;border-radius:6px;font-size:12px;display:none;z-index:6;white-space:nowrap}
 #tip{position:absolute;background:#1c1c1c;border:1px solid #555;border-radius:6px;padding:6px 8px;font-size:12px;color:#ddd;pointer-events:none;z-index:7;max-width:260px;box-shadow:0 2px 8px #000a;display:none}
  #ctxMenu{position:fixed;background:#1c1c1c;border:1px solid #444;border-radius:8px;padding:4px;z-index:30;min-width:210px;box-shadow:0 4px 16px #000a;display:none}
  #ctxMenu button{display:block;width:100%;text-align:left;background:none;border:none;color:#ddd;padding:6px 10px;font-size:13px;border-radius:6px;cursor:pointer}
  #ctxMenu button:hover{background:#2b2b2b;color:#8cf}
 #modalOverlay{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;z-index:20}
 #modal{background:#1c1c1c;border:1px solid #444;border-radius:8px;padding:14px;max-width:480px;width:90%;max-height:80vh;overflow-y:auto}
 #modal h3{margin:0 0 8px;color:#fff}
 #modal .wlist{max-height:180px;overflow-y:auto;border:1px solid #333;border-radius:6px;padding:6px;margin-top:8px}
 #modal .wline{font-size:12px;color:#fa0;margin:3px 0}
  #modal .pline{font-size:12px;color:#ddd;padding:3px 6px;border-radius:4px;cursor:pointer}
  #modal .pline:hover{background:#242424;color:#8cf}
 #modal .mbtns{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}
  /* оверлей логина (спека iterB §4.1): инлайн-копия паттерна админки, стиль студии */
  #studioLoginOverlay{position:fixed;inset:0;background:#111f;z-index:40;display:none;align-items:center;justify-content:center}
  #studioLoginOverlay .login-card{background:#1c1c1c;border:1px solid #444;border-radius:10px;padding:20px;width:340px;box-sizing:border-box;box-shadow:0 8px 32px #000c}
  #studioLoginOverlay h2{margin:0 0 4px;font-size:16px;color:#fff}
  #studioLoginOverlay p{color:#888;font-size:12px;margin:0 0 12px}
  #studioLoginOverlay input{width:100%;box-sizing:border-box;background:#222;border:1px solid #444;color:#ddd;padding:6px;border-radius:6px;margin-bottom:8px}
  #studioLoginOverlay button{width:100%}
  #studioLoginError{color:#f66;font-size:12px;margin-top:8px;min-height:16px}
  /* 99a.3: попап-деталь, справочник, режимы канваса */
  #detailOverlay{position:absolute;left:0;top:0;right:320px;bottom:0;background:#000a;z-index:10;display:none}
  #detailOverlay.expanded{right:0} /* панель свёрнута — подложка попапа на всю ширину канваса */
  /* попап категорий (99a.3-ui §14): по образцу попапа-детали */
  #catOverlay{position:absolute;left:0;top:0;right:320px;bottom:0;background:#000a;z-index:10;display:none}
  #catOverlay.expanded{right:0}
  #catPopup{position:absolute;left:calc(50% - 180px);top:50%;transform:translate(-50%,-50%);width:360px;max-height:80%;background:#1c1c1c;border:1px solid #555;border-radius:10px;z-index:11;display:none;flex-direction:column;box-shadow:0 8px 32px #000c}
  .cat-add{display:flex;gap:6px;margin-bottom:8px}
  .cat-add input{flex:1;min-width:0;background:#222;border:1px solid #444;color:#ddd;padding:5px;border-radius:6px}
  .cat-row{display:flex;align-items:center;gap:8px;padding:4px 6px;border-radius:6px;font-size:12px}
  .cat-row:hover{background:#242424}
  .cat-row .cname{flex:1;min-width:0;cursor:pointer;color:#ddd;word-break:break-word}
  .cat-row .cname:hover{color:#8cf}
  .cat-row .ccount{color:#888;font-size:11px;white-space:nowrap}
  .cat-row button{background:none;border:none;color:#999;cursor:pointer;font-size:13px;padding:2px 4px;min-width:24px;min-height:24px;border-radius:4px}
  .cat-row button:hover{background:#333;color:#fff}
  .cat-row button:disabled{opacity:.35;cursor:not-allowed}
  .cat-row button:disabled:hover{background:none;color:#999}
  .cat-row input{flex:1;min-width:0;background:#222;border:1px solid #444;color:#ddd;padding:3px 5px;border-radius:4px;font-size:12px}
  #detailPopup{position:absolute;left:calc(50% - 160px);top:50%;transform:translate(-50%,-50%);width:400px;max-height:80%;background:#1c1c1c;border:1px solid #555;border-radius:10px;z-index:11;display:none;flex-direction:column;box-shadow:0 8px 32px #000c}
  /* попап «Предложения ИИ» (спека iterC §6.5): в стиле попапа-детали, шире — селект категорий */
  #proposalsOverlay{position:absolute;left:0;top:0;right:320px;bottom:0;background:#000a;z-index:10;display:none}
  #proposalsOverlay.expanded{right:0}
  #proposalsPopup{position:absolute;left:calc(50% - 240px);top:50%;transform:translate(-50%,-50%);width:480px;max-height:80%;background:#1c1c1c;border:1px solid #555;border-radius:10px;z-index:11;display:none;flex-direction:column;box-shadow:0 8px 32px #000c}
  #proposalsPopup .popup-body select{background:#222;border:1px solid #444;color:#ddd;padding:3px;border-radius:6px;font-size:12px;margin-top:4px}
  .popup-head{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid #333;cursor:move;user-select:none;font-size:14px;color:#fff;gap:8px}
  .popup-head .ptitle{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .popup-head button{background:none;border:none;color:#999;font-size:18px;cursor:pointer;padding:0 6px;line-height:1}
  .popup-head button:hover{color:#fff}
  .popup-body{overflow-y:auto;padding:10px;font-size:12px}
  .tier-warn{color:#fa0;font-size:11px;margin-top:2px}
  #modeBadge{position:absolute;left:10px;bottom:10px;background:#1c1c1ccc;color:#666;font-size:11px;padding:3px 8px;border-radius:6px;z-index:4;pointer-events:none}
  .card.banned{opacity:.55;background:#222;border-color:#444}
  .card.hidden{opacity:.55;background:#222;border-color:#444} /* скрытая категория строений (спека скрытых §3.3) — зеркало .banned */
  .card .info{background:none;border:none;color:#8cf;cursor:pointer;font-size:12px;padding:0 2px;float:right}
  .card .info:hover{color:#fff}
  #sprav .addrow{display:flex;gap:6px;margin-bottom:6px}
  #sprav .addrow input{flex:1;min-width:0;background:#222;border:1px solid #444;color:#ddd;padding:5px;border-radius:6px}
  #sprav .addrow select{background:#222;border:1px solid #444;color:#ddd;padding:5px;border-radius:6px;max-width:110px}
  #bulkToggle{width:100%;text-align:left;font-size:12px;background:#2b2b2b;border:1px solid #4a4a4a;color:#ddd;border-radius:6px;padding:5px 8px;cursor:pointer;margin-bottom:4px}
  #bulkToggle:hover{background:#363636}
  #bulkBlock textarea{width:100%;box-sizing:border-box;background:#222;border:1px solid #444;color:#ddd;border-radius:6px;padding:5px;font-size:12px;font-family:inherit}
  #bulkBlock button{width:100%;margin-top:4px}
  /* разделы студии (спека 2026-09-20-фабрики §4): Товары/Производители/Предметы */
  .branch-btn{background:#2b2b2b;border:1px solid #4a4a4a;color:#ddd;border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
  .branch-btn:hover{background:#363636}
  .branch-btn.on{background:#26a;border-color:#26a;color:#fff}
  .popup-body textarea{background:#222;border:1px solid #444;color:#ddd;border-radius:6px;padding:4px;font-size:12px;font-family:inherit}
</style></head><body>
<header id="headbar" class="headbar">
  <div class="head-row head-title">
    <h1 style="display:inline-block">Студия товаров</h1>
    <span class="head-status">
      <span id="modelInfo">Модель ИИ: —</span>
      <span id="genIndicator"></span>
    </span>
    <button onclick="location.href='/admin'" title="Перейти в админку (общий админский токен)" style="background:#2b2b2b; border:1px solid #4a4a4a; color:#ddd; border-radius:6px; padding:5px 12px; font-size:12px; cursor:pointer;">⚙️ Админка</button>
  </div>
  <div class="head-row head-tools">
    <div class="tool-seg" id="segGraph">
      <span class="seg-label">Режим графа</span>
      <label style="font-size:12px"><input type="checkbox" id="fullTree" title="Полный граф (все товары рядами по глубине); выкл — фокус вокруг выбранного (99a.3 §6)"> всё дерево</label>
      <input id="search" type="text" placeholder="поиск по графу" style="width:150px">
      <select id="catFilter" title="Фильтр графа: показать только товары этой категории"><option value="">все категории</option></select>
      <label style="font-size:12px"><input type="checkbox" id="showResources" title="Показать на графе ряд ресурсов (по умолчанию скрыт, чтобы не мешал)"> показать ресурсы</label>
      <label style="font-size:12px"><input type="checkbox" id="showBanned"> забаненные</label>
      <label style="font-size:12px"><input type="checkbox" id="reverseEdges"> обратные рёбра</label>
      <button id="btnTop" title="Показать верхний тир (товары-верхушки)">⟲ на верхний тир</button>
    </div>
    <!-- #segActions (Экспорт/Импорт) скрыт: итерация C (спека iterB §4.6) -->
  </div>
  <div class="head-row head-secondary">
    <div class="tool-seg" id="segBranch">
      <span class="seg-label">Раздел</span>
      <button class="branch-btn on" id="branchGoods" title="Товары и ресурсы (граф рецептов)">Товары</button>
      <button class="branch-btn" id="branchProducers" title="Типы производителей (спека 2026-09-20-фабрики §4.1)">Производители</button>
      <button class="branch-btn" id="branchItems" title="Предметы — единый справочник «что бывает» (§4.2)">Предметы</button>
    </div>
    <button class="tool-seg" id="btnCatOpen" title="Управление категориями (создание/переименование/удаление)">Категории</button>
    <!-- Переключатель уровня расовости дерева построек (спека 2026-09-21 §5):
         универсальный → семейство (F0–F10) → конкретная раса (60). -->
    <div class="tool-seg" id="segProdRace" style="display:none">
      <span class="seg-label">Расовость</span>
      <select id="prodRaceLevelSel" onchange="setProdRaceLevel(this.value)" title="уровень расовости дерева построек">
        <option value="universal">Универсальный</option>
        <option value="family">Семейство</option>
        <option value="race">Раса</option>
      </select>
      <select id="prodRaceFamilySel" onchange="setProdRaceFamily(this.value)" title="семейство рас (F0–F10)" style="display:none"></select>
      <select id="prodRaceSel" onchange="setProdRace(this.value)" title="конкретная раса (60)" style="display:none"></select>
      <!-- Галка «показать скрытые» (спека скрытых §3.1): скрытые узлы — затемнённые
           карточки с пометкой «скрыта»; состояние — localStorage, дефолт выключена -->
      <label style="font-size:12px"><input type="checkbox" id="prodShowHidden" title="Показать скрытые категории построек (затемнённые карточки) на выбранном уровне расовости"> показать скрытые</label>
    </div>
  </div>
</header>
<div id="right">
  <div id="sprav">
<div class="sprav-head">
        <h3 id="spravTitle">Справочник</h3>
        <input id="spravSearch" type="text" placeholder="поиск по справочнику" style="width:100%;box-sizing:border-box;margin-bottom:6px">
        <select id="spravCat" title="Фильтр справочника по категории" style="width:100%;box-sizing:border-box;margin-bottom:6px"><option value="">все категории</option></select>
        <div class="filters" id="filters">
        <label><input type="checkbox" id="fUsed"> используемые</label>
        <label><input type="checkbox" id="fUnused"> неиспользуемые</label>
        <label><input type="checkbox" id="fBanned"> забаненные</label>
      </div>
      <div class="tierf" id="tierFilters"></div>
      <div class="addrow" id="goodsAddRow">
        <input id="spravNewName" type="text" placeholder="имя товара" autocomplete="off">
        <select id="spravNewCat"></select>
        <button class="gen" id="btnSpravAdd">+ товар</button>
      </div>
      <div class="addrow" id="resAddRow">
        <input id="spravNewResName" type="text" placeholder="имя ресурса" autocomplete="off">
        <select id="spravNewResCat"></select>
        <button class="gen" id="btnSpravAddRes">+ ресурс</button>
      </div>
      <button id="bulkToggle">▾ подгрузка списка</button>
      <div id="bulkBlock" style="display:none">

<script>
"use strict";
const $ = id => document.getElementById(id);
let state = {categories:[], goods:[], banned:[], unused:[], warnings:[], model:"", generating:false};
let selected = null;
let popupGoodId = null; // товар попапа-детали, отдельно от selected (99a.3 §10.3, вердикт критика С1)
let tierSel = new Set(); // выбранные тиры-пилюли справочника; пусто = фильтр выключен = все тиры (99a.3-ui §5.3)
// Шкала тиров каталога 0..8 (решение создателя 2026-09-19: верхний тир = Т8).
// Пилюли 0..8 показываются ВСЕГДА (создатель 2026-09-20), даже если товаров
// такого тира в базе нет — пусто видно сразу; тиры выше 8 (оверрайд) — динамически.
const TIER_FILTER_MAX = 8;
function spravTiers() {
  const base = Array.from({ length: TIER_FILTER_MAX + 1 }, (_, i) => i);
  const extra = [...new Set(state.goods.map(g => g.tier))].filter(t => t > TIER_FILTER_MAX).sort((a, b) => a - b);
  return [...base, ...extra];
}
let zoom = parseFloat(localStorage.getItem("gs_zoom") || "1");
let panX = parseFloat(localStorage.getItem("gs_panX") || "0");
let panY = parseFloat(localStorage.getItem("gs_panY") || "0");
let lastGoodsJSON = "";
let lastCatsJSON = ""; // категории тоже перерисовывают UI (попап категорий, селекты)
let lastProdSlotsJSON = "";
let lastProdTypesJSON = ""; // ветка «Производители»: слоты/типы тоже перерисовывают UI (баг B3)
let lastShownReport = ""; // отчёт fill — один раз, по изменению содержимого (спека iterC §6.4)
let lastProposalsKey = ""; // ключ предложений ИИ — авто-открытие попапа один раз (iterC §6.5, М1)
let proposalsAccepted = {}; // {index: {accepted, category_id}} — выбор в попапе «Предложения ИИ»
let dragging = null; // {goodId, name}
let loading = true;  // первичный /studio/api/state ещё не пришёл
let offline = false; // сеть потеряна (повтор идёт)
let pendingCatFilter = localStorage.getItem("gs_catFilter") || "";
// Раздел студии (спека 2026-09-20-фабрики §4): goods (граф рецептов) /
// producers (типы производителей) / items (предметы). Сохраняется.
let branch = localStorage.getItem("gs_branch") || "goods";
// Уровень расовости дерева построек (спека 2026-09-21 §2.4/§5):
// universal → family (F0–F10) → race (60). Состояние — в localStorage.
let prodRaceLevel = localStorage.getItem("gs_prodRaceLevel") || "universal";
let prodRaceFamily = localStorage.getItem("gs_prodRaceFamily") || "";
let prodRace = localStorage.getItem("gs_prodRace") || "";
let prodShowHidden = localStorage.getItem("gs_prodShowHidden") === "1"; // галка «показать скрытые» (спека скрытых §3.1)
let racesData = null; // {families, races} из /studio/api/races (спека §3)
let racesLoaded = false;

const canvas = $("graph");
const ctx = canvas.getContext("2d");
const CARD_W = 190, CARD_H = 86, GAP_X = 26, SLOT_H = 26, ROW_GAP = 64, PAD = 30;
let dropTarget = null; // {goodId, slotIndex} — подсветка слота под курсором при drag

// ---------- состояние ----------
async function fetchState() {
  try {
    const r = await studioFetch("/studio/api/state");
    if (!r.ok) return;
    state = await r.json();
    state.banned = state.banned || []; // сервер шлёт nil-слайс при 0 забаненных (BUG-1)
    if (!racesLoaded) fetchRaces(); // уровни расовости дерева построек (спека 2026-09-21 §3)
    loading = false;
    offline = false;
    $("modelInfo").textContent = "Модель ИИ: " + (state.model || "—");
    $("genIndicator").textContent = state.generating ? "⚙ генерация… (" + (state.model || "модель не задана") + ")" : "";
    // отчёт fill — один раз, по изменению содержимого (не мигает при опросах;
    // спека iterC §6.4, эталон index.html:269–273)
    if (state.report && state.report.length) {
      const rj = JSON.stringify(state.report);
      if (rj !== lastShownReport) { lastShownReport = rj; showReport(state.report); }
    } else {
      lastShownReport = "";
    }
    // попап «Предложения ИИ» — авто-открытие по ключу (спека iterC §6.5):
    // повторный опрос тот же набор не переоткрывает; else-ветка сбрасывает
    // ключ (М1: «Отмена» → повторный fill → тот же набор ИИ → попап снова
    // открывается) и закрывает попап при старте нового fill (М6)
    const props = state.proposals || [];
    if (!state.generating && props.length > 0) {
      const key = JSON.stringify(props) + state.proposals_good_id;
      if (key !== lastProposalsKey) {
        lastProposalsKey = key;
        openProposalsPopup();
      }
    } else {
      lastProposalsKey = "";
      closeProposalsPopup();
    }
    // авто-обновление: сервер шлёт auto_refresh_ms=0 — клиентский дефолт 3000 (С1)
    if (!window.__refreshStarted) {
      window.__refreshStarted = true;
      setInterval(fetchState, state.auto_refresh_ms || 3000);
    }
    const gj = JSON.stringify(state.goods);
    const cj = JSON.stringify(state.categories);
    // Ветка «Производители»: слоты родителя (producer_slots) и типы тоже
    // перерисовывают UI (редактор слотов в попапе, дерево, список справа) —
    // иначе мутация /slots или подтипа не перерисовывала UI, пока не менялись
    // goods/categories (баг B3, 2026-09-21).
    const pj = JSON.stringify(state.producer_slots);
    const tj = JSON.stringify(state.producer_types);
    if (gj !== lastGoodsJSON || cj !== lastCatsJSON || pj !== lastProdSlotsJSON || tj !== lastProdTypesJSON) {
      lastGoodsJSON = gj; lastCatsJSON = cj; lastProdSlotsJSON = pj; lastProdTypesJSON = tj; renderAll();
    }
    updateOverlays();
  } catch (e) {
    if (e && e.message === "Unauthorized") return; // 401 — оверлей показан, ретрай не нужен
    offline = true;
    if (!window.__refreshStarted) { // повтор и при сбое первого /studio/api/state (BUG-3)
      window.__refreshStarted = true;
      setInterval(fetchState, (state && state.auto_refresh_ms) || 3000);
    }
    updateOverlays();
  }
}
async function fetchResources() {
  // /api/resources остаётся на сервере (обратная совместимость, 99a.3 §8.5);
  // справочник строит список из state.goods — этот вызов не используется.
}
function showReport(lines) {
  const el = $("report");
  el.innerHTML = lines.map(l => '<div class="rline">' + esc(l) + '</div>').join("");
  el.style.display = "block";
  clearTimeout(showReport._t);
  showReport._t = setTimeout(() => el.style.display = "none", 8000);
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

// ---------- граф ----------
// Режимы канваса (99a.3 §5/§6): фокус-подграф по умолчанию, «всё дерево» —
// галкой. Тиры для отображения берутся из серверных полей GoodView.tier /
// SlotView.Tier (эффективный, 99a.3 §9.3) — клиент тиры не считает (М5).
function fullTreeMode() { return $("fullTree").checked; }
// focusSubset — подграф «вокруг выбранного» (99a.3 §5.1): выбранный + прямые
// родители (в чьих рецептах есть выбранный) + прямые дети (составляющие
// рецепта выбранного). Ресурсы, попавшие в подграф, видны всегда.
function focusSubset() {
  if (!selected) return [];
  const byId = {};
  state.goods.forEach(g => byId[g.id] = g);
  const sel = byId[selected];
  if (!sel) return [];
  const ids = new Set([selected]);
  state.goods.forEach(p => {
    if ((p.recipe || []).some(s => s.good_id === selected)) ids.add(p.id);
  });
  (sel.recipe || []).forEach(s => { if (s.good_id) ids.add(s.good_id); });
  return state.goods.filter(g => ids.has(g.id));
}
// visibleGoods: ресурсы (нижний ряд) видны всегда — фильтр категории их не
// скрывает (спека 99a.1 §10.6), поиск фильтрует всех. Только режим «всё дерево».
function visibleGoods() {
  const cat = $("catFilter").value, q = $("search").value.trim().toLowerCase();
  const showRes = $("showResources").checked;
  return state.goods.filter(g => {
    if (g.status === "banned" && !$("showBanned").checked) return false;
    if (g.kind === "resource" && !showRes) return false; // ресурсы скрыты по умолчанию
    if (cat && String(g.category_id) !== cat && g.kind !== "resource") return false;
    if (q && !g.name.toLowerCase().includes(q)) return false;
    return true;
  });
}
// depthOf — «глубина от верхушки» (сверху вниз): верхушка (никем не
// используется как составляющая) = 0, её дочки = 1, и т.д. Раскладка идёт
// по глубине, а не по тиру: слот (пустой/заполненный) всегда под своим
// родителем (решение создателя 2026-09-19). Ресурсы — как обычные дочки.
// scope — множество товаров, в пределах которого считается глубина
// (фокус-подграф: родители выбранного = корни 0, выбранный = 1, дети = 2,
// плейсхолдеры = 3; 99a.3 §5.2).
function depthOf(g, byId, memo, scope) {
  if (memo[g.id] !== undefined) return memo[g.id];
  let parentDepth = -1;
  (scope || state.goods).forEach(p => {
    if ((p.recipe || []).some(s => s.good_id === g.id)) {
      const d = depthOf(p, byId, memo, scope);
      if (d > parentDepth) parentDepth = d;
    }
  });
  memo[g.id] = parentDepth < 0 ? 0 : parentDepth + 1;
  return memo[g.id];
}
// computeLayout — древесная раскладка по глубине (верхушки сверху, вниз до
// ресурсов). Пустые слоты = виртуальные карточки-плейсхолдеры того же
// размера на уровень ниже родителя. Классика: ширина поддерева = сумма
// ширины детей, родитель центрируется над своими детьми, соседние поддеревья
// раздвигаются — слот приёмопередатчика не оказывается под вычислительным
// блоком (решение создателя 2026-09-19).
// Параметризация (99a.3 §5.2): subset — множество товаров раскладки
// (фокус-подграф или null = visibleGoods()); placeholderFor — id товара,
// для которого рисуются плейсхолдеры пустых слотов (фокус: только выбранный;
// null = все товары множества).
function computeLayout(subset, placeholderFor) {
  const byId = {};
  state.goods.forEach(g => byId[g.id] = g);
  const depthMemo = {}; // отдельный memo для depthOf (НЕ для tierOf!)
  const goods = subset || visibleGoods();
  const vis = {};
  goods.forEach(g => vis[g.id] = true);
  // виртуальные плейсхолдеры пустых слотов (глубина = глубина родителя + 1)
  const slots = [];
  goods.forEach(g => {
    if (g.kind === "resource") return;
    if (placeholderFor && g.id !== placeholderFor) return; // фокус: только пустые слоты выбранного
    const d = depthOf(g, byId, depthMemo, subset);
    (g.recipe || []).forEach((s, i) => {
      if (s.good_id) return;
      slots.push({id: "__slot:" + g.id + ":" + i, parentId: g.id, slotIndex: i, depth: d + 1, allowResource: !!s.allow_resource});
    });
  });
  const depthOfGood = {};
  goods.forEach(g => { depthOfGood[g.id] = depthOf(g, byId, depthMemo, subset); });
  const maxDepth = Math.max(0, ...Object.values(depthOfGood), ...slots.map(s => s.depth));

  // дети узла (товар или плейсхолдер): на глубине на 1 ниже
  const childMap = {}; // id -> [childId]
  const nodeDepth = {}; // id -> depth (для товаров и слотов)
  goods.forEach(g => nodeDepth[g.id] = depthOfGood[g.id]);
  slots.forEach(s => nodeDepth[s.id] = s.depth);
  function childrenOf(id) {
    if (childMap[id]) return childMap[id];
    const d = nodeDepth[id];
    const kids = [];
    // для товара: его составляющие из рецепта (дочки на глубине d+1)
    const g = byId[id];
    if (g && g.kind !== "resource") {
      (g.recipe || []).forEach(s => {
        if (!s.good_id) return;
        const cg = byId[s.good_id];
        if (cg && nodeDepth[cg.id] === d + 1) kids.push(cg.id);
      });
    }
    // плейсхолдеры пустых слотов этого родителя
    slots.forEach(s => { if (s.parentId === id && s.depth === d + 1) kids.push(s.id); });
    childMap[id] = kids;
    return kids;
  }
  // ячейки по рядам (товары + слоты), глубины 0..maxDepth
  const rowsAt = t => {
    const out = [];
    goods.forEach(g => { if (depthOfGood[g.id] === t) out.push({type: "good", id: g.id}); });
    slots.forEach(s => { if (s.depth === t) out.push({type: "slot", id: s.id, parentId: s.parentId}); });
    return out;
  };
  // ширина поддерева в «колонках»: 1, если детей нет; иначе сумма детей
  const colMemo = {};
  function colsOf(id) {
    if (colMemo[id] !== undefined) return colMemo[id];
    const kids = childrenOf(id);
    if (!kids.length) { colMemo[id] = 1; return 1; }
    let s = 0;
    kids.forEach(k => s += colsOf(k));
    colMemo[id] = s;
    return s;
  }
  // раскладка: place(id, x) ставит узел и рекурсивно детей; возвращает новую x
  const pos = {};
  let maxCols = 1;
  const rowH = CARD_H + ROW_GAP;
  function place(id, x, depth) {
    const blockW = colsOf(id) * (CARD_W + GAP_X) - GAP_X;
    pos[id] = {x: x + (blockW - CARD_W) / 2, y: PAD + depth * rowH};
    maxCols = Math.max(maxCols, x + blockW + GAP_X);
    const kids = childrenOf(id);
    let cx = x;
    kids.forEach(k => {
      place(k, cx, depth + 1);
      cx += colsOf(k) * (CARD_W + GAP_X);
    });
  }
  // корни: товары глубины 0 (верхушки); ресурсы без родителей — тоже корни
  const roots = goods.filter(g => depthOfGood[g.id] === 0);
  let x = PAD;
  const placedRoots = {};
  roots.forEach(r => {
    if (placedRoots[r.id]) return;
    place(r.id, x, 0);
    placedRoots[r.id] = true;
    x += colsOf(r.id) * (CARD_W + GAP_X);
  });
  // слоты-плейсхолдеры, не попавшие в дерево (родитель вне видимой части)
  slots.forEach(s => { if (!pos[s.id]) { pos[s.id] = {x, y: PAD + s.depth * rowH}; x += CARD_W + GAP_X; } });
  return {byId, goods, vis, maxDepth, maxCols, pos, slots};
}
// орто-ребро: вертикально вниз → горизонтально по зазору между рядами →
// вертикально к дочке. Не заезжает на чужие карточки (решение создателя
// 2026-09-19: «линии не должны выходить на территорию под другим блоком»).
function orthoEdge(a, b) {
  const x1 = a.x + CARD_W/2, y1 = a.y + CARD_H;   // низ родителя
  const x2 = b.x + CARD_W/2, y2 = b.y;            // верх дочки
  const midY = (y1 + y2) / 2;                     // «улица» между рядами
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  ctx.lineTo(x1, midY);
  ctx.lineTo(x2, midY);
  ctx.lineTo(x2, y2);
  ctx.stroke();
}
function renderGraph() {
  // Ветка «Производители» — дерево построек на канвасе (спека 2026-09-21 §2.5);
  // «Товары» — граф рецептов (как сейчас).
  if (branch === "producers") { renderProdTree(); return; }
  const subset = fullTreeMode() ? null : focusSubset();
  const L = computeLayout(subset, fullTreeMode() ? null : selected);
  const {byId, goods, vis, pos} = L;
  const cat = $("catFilter").value;
  // внутреннее разрешение = реальный CSS-размер × devicePixelRatio (чёткость,
  // регресс от растяжения canvas на 100% — карточки были размытыми)
  const dpr = window.devicePixelRatio || 1;
  const cssW = $("canvasWrap").clientWidth, cssH = $("canvasWrap").clientHeight;
  canvas.width = Math.max(1, Math.round(cssW * dpr));
  canvas.height = Math.max(1, Math.round(cssH * dpr));
  ctx.setTransform(dpr * zoom, 0, 0, dpr * zoom, dpr * panX, dpr * panY);
  ctx.clearRect(-panX/zoom, -panY/zoom, cssW/zoom, cssH/zoom);
  // рёбра (орто)
  ctx.strokeStyle = "#555";
  ctx.lineWidth = 1.5;
  goods.forEach(g => {
    if (!pos[g.id]) return;
    (g.recipe||[]).forEach(s => {
      if (!s.good_id || !pos[s.good_id] || !vis[s.good_id]) return;
      orthoEdge(pos[g.id], pos[s.good_id]);
    });
  });
  // рёбра к пустым слотам (пунктир) — родитель → плейсхолдер
  ctx.setLineDash([4, 3]);
  ctx.strokeStyle = "#666";
  L.slots.forEach(sl => {
    if (!pos[sl.parentId] || !pos[sl.id]) return;
    orthoEdge(pos[sl.parentId], pos[sl.id]);
  });
  ctx.setLineDash([]);
  // обратные рёбра — только выбранного товара (спека 99a.1 §10.7)
  if ($("reverseEdges").checked && selected && pos[selected] && vis[selected]) {
    ctx.strokeStyle = "#a62";
    state.goods.forEach(p => {
      if (p.id === selected || !pos[p.id] || !vis[p.id]) return;
      if ((p.recipe||[]).some(s => s.good_id === selected)) {
        orthoEdge(pos[p.id], pos[selected]);
      }
    });
  }
  // карточки
  goods.forEach(g => {
    const p = pos[g.id];
    if (!p) return;
    const x = p.x, y = p.y;
    const dim = cat && g.kind === "resource"; // приглушённые ресурсы при фильтре
    ctx.fillStyle = g.status === "banned" ? "#3a3a3a" : (dim ? "#262626" : "#3d3d3d");
    ctx.strokeStyle = selected === g.id ? "#8cf" : "#5a5a5a";
    ctx.lineWidth = selected === g.id ? 2 : 1;
    roundRect(x, y, CARD_W, CARD_H, 8);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = dim ? "#aaa" : "#fff";
    ctx.font = "12px Arial";
    ctx.fillText(trunc(g.name, 26), x + 8, y + 18);
    ctx.fillStyle = dim ? "#888" : "#bbb";
    ctx.font = "10px Arial";
    ctx.fillText(catName(g.category_id), x + 8, y + 32);
    // бейджи: тир — эффективный из серверного поля (99a.3 §9.3, М5)
    const badges = [];
    badges.push({t: "тир " + g.tier, c: "#5a5a5a"});
    badges.push({t: statusLabel(g.status), c: statusColor(g.status)});
    let bx = x + 8;
    badges.forEach(b => {
      const w = ctx.measureText(b.t).width + 10;
      ctx.fillStyle = b.c;
      roundRect(bx, y + 40, w, 16, 4); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.fillText(b.t, bx + 5, y + 52);
      bx += w + 4;
    });
    // Слоты под карточкой НЕ рисуются: заполненный слот = карточка дочки +
    // линия; пустой слот = виртуальная карточка-плейсхолдер того же размера
    // в ряду ниже (рисуется после блока карточек). Решение создателя 2026-09-19.
  });
  // плейсхолдеры пустых слотов — карточки того же размера, пунктир
  L.slots.forEach(sl => {
    const p = pos[sl.id];
    if (!p) return;
    const parent = byId[sl.parentId];
    const parentName = parent ? parent.name : sl.parentId;
    const x = p.x, y = p.y;
    ctx.setLineDash([5, 4]);
    ctx.fillStyle = "#1a1a1a";
    ctx.strokeStyle = "#777";
    ctx.lineWidth = 1.5;
    roundRect(x, y, CARD_W, CARD_H, 8);
    ctx.fill(); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = "#999";
    ctx.font = "12px Arial";
    // галка «заполнять ресурсом» (99a Пакет 4, п.8): метка на плейсхолдере
    ctx.fillText(sl.allowResource ? "⚙ ресурс" : "пусто", x + 8, y + 18);
    ctx.font = "10px Arial";
    ctx.fillText("слот для «" + trunc(parentName, 22) + "»", x + 8, y + 32);
  });
}
function trunc(s, n) { return s.length > n ? s.slice(0, n - 1) + "…" : s; }
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function catName(id) {
  const c = state.categories.find(c => c.id === id);
  return c ? c.name : id;
}
function statusLabel(s) {
  return {approved:"✓ согласовано", draft:"🔨 черновик", excluded:"✗ исключено", banned:"⛔ бан"}[s] || s;
}
function statusColor(s) {
  return {approved:"#2a7", draft:"#a62", excluded:"#a33", banned:"#555"}[s] || "#444";
}

// ---------- клики и пан/зум ----------
// hitTest — только карточка {type:"card", id}. Слоты на канвасе не рисуются
// (только линии-рёбра; решение создателя 2026-09-19: «между радаром и тем,
// из чего он сделан, только линии связующие должны быть») — клик по слоту
// убран, выбор составляющей — по её карточке.
function hitTest(ev) {
  const rect = canvas.getBoundingClientRect();
  const mx = (ev.clientX - rect.left - panX) / zoom;
  const my = (ev.clientY - rect.top - panY) / zoom;
  if (branch === "producers") return prodTreeHitTest(mx, my);
  const L = computeLayout(fullTreeMode() ? null : focusSubset(), fullTreeMode() ? null : selected);
  for (const g of L.goods) {
    const p = L.pos[g.id];
    if (!p) continue;
    if (mx >= p.x && mx <= p.x + CARD_W && my >= p.y && my <= p.y + CARD_H) return {type: "card", id: g.id};
  }
  return null;
}
let panning = null, downPos = null, moved = false;
let downOnCard = null; // id карточки под mousedown (для dblclick-fallback: карточка могла уехать после перестройки подграфа)
canvas.addEventListener("mousedown", ev => {
  hideCtxMenu();
  const hit = hitTest(ev);
  downPos = {x: ev.clientX, y: ev.clientY};
  moved = false;
  // второй клик двойного (detail>1): карточка могла уехать после перестройки
  // подграфа первым кликом — downOnCard первого клика сохраняется для dblclick
  if (!(ev.detail > 1 && downOnCard)) {
    downOnCard = hit && hit.type === "card" ? hit.id : null;
  }
  if (hit && hit.type === "card") {
    if (branch === "producers") {
      // дерево построек (спека 2026-09-21 §2.5): тип/подтип — выбор узла;
      // узел-приглашение — попап создания; фиксированный узел — справка
      const n = prodNodeById(hit.id);
      if (n) { selected = hit.id; renderAll(); centerOn(hit.id); }
      else if (hit.id.indexOf("invite:") === 0) { openProdCreatePopup(hit.id); }
      else { openProdNodePopup(hit.id); }
    } else {
      selected = hit.id; renderAll();
      // центрировать вид на выбранной карточке (зум сохраняется): в фокус-режиме
      // подграф перестраивается и карточка могла уехать за край вьюпорта
      // (требование создателя 2026-09-19); в полном дереве раскладка не меняется —
      // карточка уже видна, центрирование не нужно; pan-драг начинается с пустого
      // места (ветка else) — здесь не срабатывает
      if (!fullTreeMode()) centerOn(hit.id);
    }
  }
  else { panning = {x: ev.clientX, y: ev.clientY}; canvas.style.cursor = "grabbing"; }
});
window.addEventListener("mousemove", ev => {
  if (downPos && (Math.abs(ev.clientX - downPos.x) > 4 || Math.abs(ev.clientY - downPos.y) > 4)) moved = true;
  if (panning) {
    panX += ev.clientX - panning.x;
    panY += ev.clientY - panning.y;
    panning = {x: ev.clientX, y: ev.clientY};
    saveView(); renderGraph();
    return;
  }
  const hit = hitTest(ev);
  if (hit && hit.type === "card") { showTip(ev, hit.id); canvas.style.cursor = "pointer"; }
  else { hideTip(); canvas.style.cursor = "grab"; }
});
window.addEventListener("mouseup", ev => {
  if (panning) { panning = null; canvas.style.cursor = "grab"; }
  // Клик по пустому месту выбор НЕ сбрасывает (создатель 2026-09-19: «по клику
  // вне графа на канвасе не очищать его, мешает») — только pan (mousedown без
  // hit ставит panning). Оверлей «Кликните товар в справочнике» — только при
  // отсутствии выбора изначально (пустой старт), не после кликов.
  downPos = null;
});
// двойной клик по карточке = выбор + попап-деталь (99a.3 §10.3)
canvas.addEventListener("dblclick", ev => {
  const hit = hitTest(ev);
  // hitTest может не найти карточку: первый клик двойного перестроил подграф,
  // карточка уехала из точки клика — fallback на downOnCard (карточка первого клика)
  const id = hit && hit.type === "card" ? hit.id : downOnCard;
  if (id) { selected = id; openPopup(id); renderAll(); }
  downOnCard = null;
});
canvas.addEventListener("mouseleave", hideTip);
canvas.addEventListener("wheel", ev => {
  ev.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
  const factor = ev.deltaY < 0 ? 1.15 : 1 / 1.15;
  const nz = Math.min(4, Math.max(0.2, zoom * factor));
  panX = mx - (mx - panX) * (nz / zoom);
  panY = my - (my - panY) * (nz / zoom);
  zoom = nz;
  saveView(); renderGraph();
});
function saveView() {
  // Вид канваса по ветке: дерево построек — свой zoom/pan (спека §2.5).
  if (branch === "producers") {
    localStorage.setItem("gs_prodZoom", zoom);
    localStorage.setItem("gs_prodPanX", panX);
    localStorage.setItem("gs_prodPanY", panY);
  } else {
    localStorage.setItem("gs_zoom", zoom);
    localStorage.setItem("gs_panX", panX);
    localStorage.setItem("gs_panY", panY);
  }
  localStorage.setItem("gs_viewPos", "1"); // позиция сохранена — при старте не центрировать
}
// Центрирование: показать верхний тир (товары-верхушки, не ресурсы).
// Сбрасывает уехавший pan (напр. сохранённый от старого широкого канваса).
// Только режим «всё дерево» (в фокусе кнопка скрыта); при resize/сворачивании
// панели в фокусе — центрирование на выбранном (99a.3 §10.2).
function centerTop() {
  if (branch === "producers") { centerProdTree(); return; }
  if (!fullTreeMode()) {
    if (selected) { centerOn(selected); return; }
    zoom = 1; panX = 0; panY = 0; saveView(); renderGraph(); return;
  }
  const L = computeLayout();
  const goods = L.goods.filter(g => g.kind !== "resource");
  if (!goods.length) { zoom = 1; panX = 0; panY = 0; saveView(); renderGraph(); return; }
  const rect = canvas.getBoundingClientRect();
  // верхушки — глубина 0 (верхний ряд): товары без родителей
  const depthMemo = {};
  const byId = {};
  state.goods.forEach(g => byId[g.id] = g);
  const top = L.goods.filter(g => g.kind !== "resource" && depthOf(g, byId, depthMemo) === 0);
  const list = top.length ? top : goods;
  const first = list[0], p = L.pos[first.id];
  // масштаб: чтобы верхний ряд поместился в ширину экрана
  const nz = Math.max(0.2, Math.min(1, (rect.width - 40) / (list.length * (CARD_W + GAP_X))));
  zoom = Math.max(0.2, Math.min(4, nz));
  panX = rect.width / 2 - (p.x + CARD_W / 2) * zoom;
  panY = rect.height / 2 - (p.y + CARD_H / 2) * zoom;
  saveView(); renderGraph();
}
// centerProdTree — центрирование дерева построек целиком (4 уровня в кадр).
function centerProdTree() {
  const L = prodTreeLayout();
  const rect = canvas.getBoundingClientRect();
  const w = L.maxCols * (CARD_W + GAP_X) - GAP_X + PAD * 2;
  const h = 4 * (CARD_H + ROW_GAP) + PAD * 2; // 4 уровня дерева
  const nz = Math.max(0.2, Math.min(1, Math.min((rect.width - 40) / w, (rect.height - 40) / h)));
  zoom = Math.max(0.2, Math.min(4, nz));
  panX = rect.width / 2 - (L.pos["root"].x + CARD_W / 2) * zoom;
  panY = rect.height / 2 - (L.pos["root"].y + CARD_H / 2) * zoom;
  saveView(); renderGraph();
}
// centerOn — центрировать вид на товаре (зум сохраняется): выбор из
// справочника (99a.3 §10.2, гейт-вопрос 2).
function centerOn(id) {
  if (branch === "producers") {
    const L = prodTreeLayout();
    const p = L.pos[id];
    if (!p) return;
    const rect = canvas.getBoundingClientRect();
    panX = rect.width / 2 - (p.x + CARD_W / 2) * zoom;
    panY = rect.height / 2 - (p.y + CARD_H / 2) * zoom;
    saveView(); renderGraph();
    return;
  }
  const L = computeLayout(fullTreeMode() ? null : focusSubset(), fullTreeMode() ? null : selected);
  const p = L.pos[id];
  if (!p) return;
  const rect = canvas.getBoundingClientRect();
  panX = rect.width / 2 - (p.x + CARD_W / 2) * zoom;
  panY = rect.height / 2 - (p.y + CARD_H / 2) * zoom;
  saveView(); renderGraph();
}

// Деталь товара — модальное окно поверх канваса; правая панель = только

// действия попапа идут в /api/goods/{popupGoodId} (вердикт критика С1).
function openPopup(id) {
  // Ветка «Производители»: узел дерева → попап детали/создания/справка (§2.5).
  if (branch === "producers") { openProdNodePopup(id); return; }
  popupGoodId = id;
  $("detailPopup").style.display = "flex";
  $("detailOverlay").style.display = "block";
  renderPopup();
}
function closePopup() {
  popupGoodId = null;
  $("detailPopup").style.display = "none";
  $("detailOverlay").style.display = "none";
}
function renderPopup() {
  const el = $("popupBody");
  if (!popupGoodId) return;
  const g = state.goods.find(x => x.id === popupGoodId);
  if (!g) { // товар попапа удалён (в попапе или извне) — закрыть; selected сбросить, если был он (99a.3 §10.3, М3)
    if (selected === popupGoodId) selected = null;
    closePopup();
    return;
  }
  $("popupTitle").textContent = g.name;
  const isRes = g.kind === "resource";
  let html = '';
  // имя: клик — inline-переименование (ресурсы без привилегий, спека iterB §4.5)
  html += '<div class="dname"><span class="rename" onclick="startRename()" title="переименовать">' + esc(g.name) + '</span></div>';
  // категория: селект — смена (товарные/ресурсные раздельно, §4.5)
  html += '<div class="dmeta">';
  html += '<select class="dcat" onchange="changeCategory(this.value)">' +
    state.categories.filter(c => c.kind === (isRes ? "resource" : "good")).map(c => '<option value="' + c.id + '"' + (c.id === g.category_id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join("") +
    '</select>';
  // тир-оверрайд (99a.3 §10.4; ресурсам — тоже, С3): пусто = вычисленный;
  // ввод → PUT tier; очистка → null
  const ov = (g.tier_override !== null && g.tier_override !== undefined) ? g.tier_override : "";
  html += ' · тир: <input id="tierInput" type="number" min="0" style="width:56px" value="' + ov + '" onchange="setTier(this.value)" title="ручной тир (оверрайд); пусто = вычисляется"> (вычислен ' + g.tier_computed + ')';
  if (ov !== "" && ov !== g.tier_computed) {
    html += '<div class="tier-warn">⚠ отличается от вычисленного (' + g.tier_computed + ')</div>';
  }
  html += ' · ' + statusLabel(g.status) + (g.source === "ai" ? ' · ИИ' : g.source === "import" ? ' · импорт' : '');
  html += '</div>';
  // объём/вес — данные каталога (спека 2026-09-20-фабрики §3.1, 3b.6.4):
  // NULL у draft; approved без веса/объёма не проходит валидацию
  html += '<div class="dmeta">объём: <input id="volInput" type="number" min="0" step="any" style="width:70px" value="' + (g.volume !== null && g.volume !== undefined ? g.volume : "") + '" onchange="setVolumeWeight(this.value, null)" title="объём единицы товара (NULL у draft)">' +
    ' · вес: <input id="wgtInput" type="number" min="0" step="any" style="width:70px" value="' + (g.weight !== null && g.weight !== undefined ? g.weight : "") + '" onchange="setVolumeWeight(null, this.value)" title="вес единицы товара (NULL у draft)"></div>';
  // слоты: только у товаров (ресурс — лист, слотов нет, §4.5); заполненный и
  // пустой — оба drop-target (замена в одно действие); тир в заполненном
  // слоте — эффективный из SlotView.Tier (99a.3 §9.3)
  if (!isRes) {
    (g.recipe || []).forEach((s, i) => {
      if (s.good_id) {
        html += '<div class="slot" ondragover="slotDragOver(event,this)" ondragleave="slotDragLeave(this)" ondrop="dropOnSlot(event,' + i + ')">' +
                '<button onclick="clearSlot(' + i + ')" title="исключить из рецепта" aria-label="исключить из рецепта">×</button>' +
                '<button class="delslot" onclick="delSlot(' + i + ')" title="удалить слот целиком" aria-label="удалить слот">🗑</button>' +
                '<span class="sname">' + esc(s.name || s.good_id) + '</span>' +
                ' <span style="color:#777">тир ' + s.tier + '</span>' +
                ' <span style="color:#999">×</span> <input type="number" min="1" style="width:52px" value="' + (s.quantity || 1) + '" onchange="setQuantity(' + i + ', this.value)" title="количество единиц составляющей">' +
                (s.reason ? '<div class="sreason">' + esc(s.reason) + '</div>' : '') + '</div>';
      } else {
        html += '<div class="slot empty" ondragover="slotDragOver(event,this)" ondragleave="slotDragLeave(this)" ondrop="dropOnSlot(event,' + i + ')">' +
                '<button class="delslot" onclick="delSlot(' + i + ')" title="удалить слот целиком" aria-label="удалить слот">🗑</button>' +
                'пусто — перетащите сюда карточку' +
                '<label class="allowres" title="С галкой ИИ может предложить для этого слота ресурс; без галки — только товары"><input type="checkbox" onchange="setAllowResource(' + i + ', this.checked)"' + (s.allow_resource ? ' checked' : '') + '> заполнять ресурсом</label></div>';
      }
    });
  }
  // кнопки (ресурсы — без слотов/fill, но со всеми статусами и удалением, §4.5)
  html += '<div class="btns">';
  html += '<button onclick="askAddParent()" title="Добавить этот товар составляющей в рецепт другого товара (новый слот)">добавить родителя</button>';
  if (!isRes) {
    const hasEmpty = (g.recipe || []).some(s => !s.good_id);
    const fillDisabled = state.generating || !hasEmpty;
    html += '<button class="gen" onclick="addSlot()">+ слот</button>';
    html += '<button class="gen" onclick="fillGood()"' + (fillDisabled ? ' disabled title="' + (state.generating ? "идёт генерация" : "Сначала добавьте слот («+ слот»)") + '"' : '') + '>заполнить комплектующие</button>';
  }
  if (g.status !== "approved") html += '<button class="ok" onclick="setStatus(\'approved\')">Согласовать</button>';
  if (g.status !== "excluded") html += '<button class="del" onclick="setStatus(\'excluded\')">Исключить</button>';
  if (g.status !== "banned") html += '<button class="del" onclick="setStatus(\'banned\')">Забанить</button>';
  if (g.status === "banned") html += '<button class="ok" onclick="setStatus(\'unban\')">Вернуть</button>';
  html += '<button class="del" onclick="askDeleteGood()">удалить</button>';
  html += '</div>';
  // «Используется в:» — клик по родителю = выбор родителя + попап на нём (99a.3 §10.3)
  const parents = state.goods.filter(p => (p.recipe || []).some(s => s.good_id === g.id));
  html += '<div class="usedin"><div class="usedin-h">Используется в:</div>';
  if (parents.length) {
    html += parents.map(p => '<div class="usedin-item" onclick="openParent(\'' + p.id + '\')">' + esc(p.name) + ' <span style="color:#777">· тир ' + p.tier + '</span></div>').join("");
  } else {
    html += '<div class="empty-note">нигде не используется</div>';
  }
  html += '</div>';
  el.innerHTML = html;
}
function openParent(id) {
  selected = id;
  openPopup(id);
  renderAll();
  if (!fullTreeMode()) centerOn(id);
}
function selectGood(id) { selected = id; renderAll(); }
function startRename() {
  const g = state.goods.find(x => x.id === popupGoodId);
  if (!g) return;
  const el = $("popupBody").querySelector(".dname");
  el.innerHTML = '<input id="renameInput" type="text" value="' + esc(g.name) + '" style="width:100%;box-sizing:border-box">';
  const inp = $("renameInput");
  inp.focus(); inp.select();
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter") commitRename();
    if (ev.key === "Escape") renderPopup();
  });
  inp.addEventListener("blur", commitRename);
}
async function commitRename() {
  const inp = $("renameInput");
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) { renderPopup(); return; }
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId, {name});
  if (r) fetchState(); else renderPopup();
}
async function changeCategory(catId) {
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId, {category_id: Number(catId)});
  if (r) fetchState();
}
async function api(method, url, body) {
  let r;
  try {
    r = await studioFetch(url, {method, headers: {"Content-Type": "application/json"}, body: body ? JSON.stringify(body) : undefined});
  } catch (e) {
    return null; // 401 — оверлей уже показан (studioFetch)
  }
  if (!r.ok) {
    let msg = "ошибка " + r.status;
    try { const e = await r.json(); if (e.error) msg = e.error; } catch (e) {}
    showReport([msg]);
    return null;
  }
  return r;
}
async function addSlot() { await api("POST", "/studio/api/goods/" + popupGoodId + "/slots"); fetchState(); }
async function clearSlot(i) { await api("DELETE", "/studio/api/goods/" + popupGoodId + "/slots/" + i + "/component"); fetchState(); }
async function delSlot(i) { await api("DELETE", "/studio/api/goods/" + popupGoodId + "/slots/" + i); fetchState(); }
async function setAllowResource(i, checked) {
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId + "/slots/" + i + "/allow_resource", {allow_resource: checked});
  if (r) fetchState();
}
// количество единиц составляющей в слоте (99a.2 §6.5): change → PUT {quantity};
// ошибка — тост, значение возвращается (renderPopup перерисует из state)
async function setQuantity(i, val) {
  const q = parseInt(val, 10);
  if (!q || q < 1) { renderPopup(); return; }
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId + "/slots/" + i, {quantity: q});
  if (r) fetchState(); else renderPopup();
}
async function setStatus(s) { await api("POST", "/studio/api/goods/" + popupGoodId + "/status", {status: s}); fetchState(); }

// ---------- fill: «заполнить комплектующие» (спека iterC §6) ----------
// Двухфазный: POST fill → ИИ думает (асинхронно) → proposals в state →
// попап «Предложения ИИ» (авто-открытие в fetchState) → apply/cancel.
async function fillGood() {
  const g = state.goods.find(x => x.id === popupGoodId);
  if (g && !(g.recipe || []).some(s => !s.good_id)) {
    showReport(["Сначала добавьте слот («+ слот»)"]);
    return;
  }
  const r = await api("POST", "/studio/api/goods/" + popupGoodId + "/fill");
  if (r) showReport(["ИИ думает… — предложения появятся в попапе"]);
  fetchState();
}
function openProposalsPopup() {
  proposalsAccepted = {}; // новый набор предложений — свежий выбор
  $("proposalsPopup").style.display = "flex";
  $("proposalsOverlay").style.display = "block";
  renderProposalsPopup();
}
function closeProposalsPopup() {
  $("proposalsPopup").style.display = "none";
  $("proposalsOverlay").style.display = "none";
}
// попап «Предложения ИИ» (спека iterC §6.5): строка на каждый proposal —
// kind=link: «Заполнить слот N готовым товаром „Z"» + переключатель
// [Заполнить ✓/Пропустить]; kind=new: «Создать новый товар „X"» + селект
// товарных категорий (дефолт — category_id если валидна, иначе категория
// родителя) + пометка «категория не найдена»; футер «Применить выбранное
// (N)» (disabled при N=0) / «Отмена».
function renderProposalsPopup() {
  const el = $("proposalsPopupBody");
  const props = state.proposals || [];
  const good = state.goods.find(x => x.id === state.proposals_good_id);
  $("proposalsPopupTitle").textContent = "Предложения ИИ для «" + (good ? good.name : state.proposals_good_id) + "»";
  const goodCats = state.categories.filter(c => c.kind === "good");
  const parentCat = good ? good.category_id : null;
  // вычистить устаревшие индексы (новый набор предложений после повторного fill)
  Object.keys(proposalsAccepted).forEach(i => { if (Number(i) >= props.length) delete proposalsAccepted[i]; });
  let html = '<div class="hint" style="margin-bottom:8px">применятся только принятые пункты</div>';
  props.forEach((p, i) => {
    if (!proposalsAccepted[i]) {
      proposalsAccepted[i] = {
        accepted: true,
        category_id: p.kind === "new" ? (p.category_valid ? p.category_id : parentCat) : null
      };
    }
    const a = proposalsAccepted[i];
    if (p.kind === "link") {
      html += '<div class="slot" style="margin-bottom:8px">' +
        '<label style="display:block;margin-bottom:4px;cursor:pointer"><input type="checkbox"' + (a.accepted ? ' checked' : '') + ' onchange="toggleProposal(' + i + ', this.checked)"> Заполнить слот ' + p.slot + ' готовым товаром «' + esc(p.link_name || p.name) + '»</label>' +
        (p.reason ? '<div class="sreason">' + esc(p.reason) + '</div>' : '') +
        '</div>';
    } else {
      const catOpts = goodCats.map(c => '<option value="' + c.id + '"' + (c.id === a.category_id ? ' selected' : '') + '>' + esc(c.name) + '</option>').join("");
      const warn = !p.category_valid ? '<div style="color:#f66;font-size:11px;margin-top:2px">категория «' + esc(p.category) + '» не найдена — выбрана категория родителя</div>' : '';
      html += '<div class="slot" style="margin-bottom:8px">' +
        '<label style="display:block;margin-bottom:4px;cursor:pointer"><input type="checkbox"' + (a.accepted ? ' checked' : '') + ' onchange="toggleProposal(' + i + ', this.checked)"> Создать новый товар «' + esc(p.name) + '»</label>' +
        '<select onchange="proposalCategory(' + i + ', this.value)">' + catOpts + '</select>' + warn +
        (p.reason ? '<div class="sreason">' + esc(p.reason) + '</div>' : '') +
        '</div>';
    }
  });
  const n = Object.values(proposalsAccepted).filter(a => a.accepted).length;
  html += '<div class="btns">' +
    '<button class="gen" id="proposalsApplyBtn" onclick="applyProposals()"' + (n === 0 ? ' disabled' : '') + '>Применить выбранное (' + n + ')</button>' +
    '<button onclick="cancelProposals()">Отмена</button>' +
    '</div>';
  el.innerHTML = html;
}
function toggleProposal(i, checked) {
  if (proposalsAccepted[i]) proposalsAccepted[i].accepted = checked;
  renderProposalsPopup();
}
function proposalCategory(i, val) {
  if (proposalsAccepted[i]) proposalsAccepted[i].category_id = Number(val);
}
// «Применить выбранное»: собрать accepted = [{i, category_id}] (i — индекс в
// state.proposals, category_id — выбранный селект для kind=new) → apply
async function applyProposals() {
  const accepted = [];
  Object.keys(proposalsAccepted).forEach(i => {
    const a = proposalsAccepted[i];
    if (!a.accepted) return;
    const item = { i: Number(i) };
    const p = (state.proposals || [])[i];
    if (p && p.kind === "new") item.category_id = a.category_id;
    accepted.push(item);
  });
  if (!accepted.length) return;
  const r = await api("POST", "/studio/api/goods/" + state.proposals_good_id + "/fill/apply", { accepted });
  if (r) { closeProposalsPopup(); fetchState(); }
}
// «Отмена»: cancel → proposals сброшены (попап не переоткроется опросом)
async function cancelProposals() {
  const r = await api("POST", "/studio/api/goods/" + state.proposals_good_id + "/fill/cancel");
  if (r) { closeProposalsPopup(); fetchState(); }
}
// тир-оверрайд (99a.3 §10.4): ввод числа → PUT {tier}; очистка → PUT {tier: null}
async function setTier(val) {
  const v = String(val).trim();
  const body = v === "" ? {tier: null} : {tier: parseInt(v, 10)};
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId + "/tier", body);
  if (r) fetchState(); else renderPopup();
}
// объём/вес (спека 2026-09-20-фабрики §3.1, 3b.6.4): ввод числа → PUT;
// очистка → null (draft может быть без значений)
async function setVolumeWeight(vol, wgt) {
  const body = {};
  if (vol !== null) {
    const v = String(vol).trim();
    body.volume = v === "" ? null : parseFloat(v);
  }
  if (wgt !== null) {
    const v = String(wgt).trim();
    body.weight = v === "" ? null : parseFloat(v);
  }
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId, body);
  if (r) fetchState(); else renderPopup();
}
function slotDragOver(ev, el) { ev.preventDefault(); el.classList.add("drop-target"); }
function slotDragLeave(el) { el.classList.remove("drop-target"); }
async function dropOnSlot(ev, i) {
  ev.preventDefault();
  ev.currentTarget.classList.remove("drop-target");
  const goodId = ev.dataTransfer.getData("text/plain");
  if (!goodId) return;
  // good_id — число (сервер парсит *int64; строка → 400, вердикт критика С2)
  const r = await api("PUT", "/studio/api/goods/" + popupGoodId + "/slots/" + i, {good_id: Number(goodId)});
  if (r) fetchState();
}

// ---------- модалки ----------
function openModal(html, buttons) {
  $("modalBody").innerHTML = html;
  $("modalBtns").innerHTML = buttons.map((b, i) =>
    '<button class="' + b.cls + '" data-idx="' + i + '"' + (b.primary ? ' data-primary="1"' : '') + '>' + esc(b.label) + '</button>').join("");
  $("modalBtns").querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => buttons[+btn.dataset.idx].action());
  });
  $("modalOverlay").style.display = "flex";
  const primary = $("modalBtns").querySelector("button[data-primary]");
  if (primary) primary.focus();
}
function closeModal() { $("modalOverlay").style.display = "none"; }
document.addEventListener("keydown", ev => {
  if ($("modalOverlay").style.display !== "flex") return;
  if (ev.key === "Escape") closeModal();
  if (ev.key === "Enter") {
    const primary = $("modalBtns").querySelector("button[data-primary]");
    if (primary) primary.click();
  }
});
function askDeleteGood() {
  const g = state.goods.find(x => x.id === popupGoodId);
  if (!g) return;
  const n = state.goods.reduce((acc, p) => acc + (p.recipe || []).filter(s => s.good_id === g.id).length, 0);
  openModal(
    '<h3>Удалить товар</h3>' +
    '<div>Удалить товар «' + esc(g.name) + '»?</div>',
    [
      {label: "Удалить", cls: "del", primary: true, action: () => confirmDeleteGood(g, n)},
      {label: "Отмена", cls: "", action: closeModal}
    ]
  );
}
// второе подтверждение при N > 0 (спека iterB §4.7): слоты других товаров,
// ссылающиеся на удаляемого, очистятся — рецепты будут испорчены
function confirmDeleteGood(g, n) {
  if (n > 0) {
    openModal(
      '<h3>Удалить товар</h3>' +
      '<div>Слоты, ссылающиеся на него (' + n + '), очистятся — рецепты этих товаров будут испорчены. Удалить всё равно?</div>',
      [
        {label: "Удалить и очистить " + n + " ссылок", cls: "del", primary: true, action: doDeleteGood},
        {label: "Отмена", cls: "", action: closeModal}
      ]
    );
    return;
  }
  doDeleteGood();
}
async function doDeleteGood() {
  closeModal();
  const r = await api("DELETE", "/studio/api/goods/" + popupGoodId);
  if (r) {
    // фактический счётчик — из ответа (источник правды; K может отличаться
    // от N при гонке/другой сессии между расчётом и ответом, §4.7)
    const out = await r.json();
    const k = out && out.cleared_links !== undefined ? out.cleared_links : 0;
    showReport([(k > 0 ? "⚠ " : "") + "Удалено. Очищено ссылок: " + k]);
  }
  if (selected === popupGoodId) selected = null; // удалённый был выбран — сброс (99a.3 §10.3, М3)
  closePopup();
  if (r) fetchState();
}

// ---------- «добавить родителя» (99a Пакет 2, п.6) ----------
// Обратное «Используется в:»: выбранный товар становится составляющей
// другого товара (новый слот у родителя). Два вызова: POST слот → PUT
// заполнить; при 409 (цикл) — откат: только что добавленный слот удаляется.
function askAddParent() {
  const g = state.goods.find(x => x.id === popupGoodId);
  if (!g) return;
  // родитель — товар с рецептом (не ресурс); сам себя исключаем (цикл).
  // Уже-родители не исключаются — добавится ещё один слот.
  const candidates = state.goods.filter(p => p.kind !== "resource" && p.id !== popupGoodId);
  const html = '<h3>Добавить родителя</h3>' +
    '<div style="font-size:12px;color:#999;margin-bottom:6px">«' + esc(g.name) + '» станет составляющей выбранного товара (новый слот).</div>' +
    '<div class="wlist">' + (candidates.length ? candidates.map(p =>
      '<div class="pline" onclick="addParent(\'' + p.id + '\')">' + esc(p.name) +
      ' <span style="color:#777">· ' + esc(catName(p.category_id)) + ' · тир ' + p.tier + '</span></div>'
    ).join("") : '<div class="empty-note">нет товаров-кандидатов</div>') + '</div>';
  openModal(html, [{label: "Отмена", cls: "", action: closeModal}]);
}
async function addParent(parentId) {
  closeModal();
  // Номер нового слота — из текущего состояния, НЕ из ответа POST: контракт
  // iterA §7 возвращает {"id": id} без recipe (BUG-1, спека iterB §7.4);
  // POST добавляет слот в конец (pos = MAX(pos)+1, репозиторий AddSlot).
  const parent = state.goods.find(x => x.id === parentId);
  if (!parent) return;
  const n = parent.recipe.length;
  const r = await api("POST", "/studio/api/goods/" + parentId + "/slots");
  if (!r) return;
  const r2 = await api("PUT", "/studio/api/goods/" + parentId + "/slots/" + n, {good_id: Number(popupGoodId)});
  if (!r2) {
    // откат: цикл 409 и т.п. — убрать только что добавленный пустой слот
    await api("DELETE", "/studio/api/goods/" + parentId + "/slots/" + n);
  }
  fetchState();
}

// ---------- справочник (99a.3 §8) ----------
// Единый список всех товаров + ресурсов из state.goods; поиск по имени,
// галки-фильтры (ортогональны, по умолчанию выключены), карточки draggable
// (источник drag&drop в слоты попапа), клик = выбор, двойной клик / ⓘ = попап.
function renderSprav() {
  if (branch === "producers") { renderProdSprav(); return; }
  if (branch === "items") { renderItemSprav(); return; }
  const sc = $("spravList").scrollTop; // сохранить scroll списка при пересборке (поиск/пилюли/галки)
  const q = $("spravSearch").value.trim().toLowerCase();
  // фильтр по категории (пусто = все); при старте renderSprav идёт до renderCatSelects —
  // опции ещё не заполнены, берём сохранённое значение из localStorage
  const cat = $("spravCat").value || localStorage.getItem("gs_spravCat") || "";
  const used = {};
  state.goods.forEach(g => (g.recipe || []).forEach(s => { if (s.good_id) used[s.good_id] = true; }));
  const fUsed = $("fUsed").checked, fUnused = $("fUnused").checked, fBanned = $("fBanned").checked;
  // Семантика фильтров (создатель 2026-09-19): показ включается ТОЛЬКО при «тир + галка»:
  // выбран хотя бы один тир И хотя бы одна галка. Галки — группы-РАСШИРЕНИЯ (OR):
  // каждая включённая добавляет свою группу («используемые»/«неиспользуемые»/«забаненные»),
  // выключенная — её группа скрыта. Категория и поиск только сужают (AND), сами показ не включают.
  const hasTier = tierSel.size > 0;
  const hasFlag = fUsed || fUnused || fBanned;
  // пилюли тиров: «все» первой + фиксированные 0..8 + тиры выше 8 из каталога (если есть)
  const tiers = spravTiers();
  // «все» активна, только когда выбраны ВСЕ тиры (показывается всё); при пустом
  // выборе фильтр тиров выключен — список пуст (создатель 2026-09-19)
  const allOn = tierSel.size === tiers.length;
  $("tierFilters").innerHTML =
    '<label class="pill' + (allOn ? ' on' : '') + '" title="все тиры">' +
    '<input type="checkbox" style="display:none"' + (allOn ? ' checked' : '') + ' onchange="toggleAllTiers()">все</label>' +
    tiers.map(t =>
      '<label class="pill' + (tierSel.has(t) ? ' on' : '') + '"' + (t === 0 ? ' title="тир 0"' : '') + '>' +
      '<input type="checkbox" style="display:none"' + (tierSel.has(t) ? ' checked' : '') + ' onchange="toggleTier(' + t + ', this.checked)">' + t + '</label>'
    ).join("");
  const list = state.goods.filter(g => {
    if (!hasTier || !hasFlag) return false;               // тир + галка обязательны (создатель 2026-09-19)
    if (!tierSel.has(g.tier)) return false;               // выбранные тиры — только они
    // галки — РАСШИРЕНИЕ (OR): каждая включает свою группу; выключенная — её группа
    // скрыта. Забаненные — отдельная группа (только при галке «забаненные»),
    // не смешивается с используемыми/неиспользуемыми (создатель 2026-09-19).
    const isBanned = g.status === "banned";
    const isUsed = !!used[g.id];
    if (isBanned) { if (!fBanned) return false; }
    else if (isUsed) { if (!fUsed) return false; }
    else { if (!fUnused) return false; }
    if (cat && String(g.category_id) !== cat) return false;          // AND: фильтр по категории (сужает, не включает показ)
    if (q && !g.name.toLowerCase().includes(q)) return false; // AND: поиск (сужает, не включает показ)
    return true;
  });
  $("spravTitle").textContent = "Справочник · " + list.length;
  $("spravList").innerHTML = list.map(g =>
    '<div class="card' + (g.status === "banned" ? ' banned' : '') + '" draggable="true" ondragstart="dragStart(event,\'' + g.id + '\')" onclick="spravClick(\'' + g.id + '\')" ondblclick="spravDblClick(\'' + g.id + '\')" oncontextmenu="showSpravCtxMenu(event,\'' + g.id + '\');return false">' +
    '<div class="nm">' + esc(g.name) + '<button class="info" onclick="event.stopPropagation();openPopup(\'' + g.id + '\')" title="деталь (без смены выбора)">ⓘ</button></div>' +
    '<div class="meta">' + esc(catName(g.category_id)) + ' · тир ' + g.tier + ' <span class="badge ' + badgeClass(g.status) + '">' + esc(statusLabel(g.status)) + '</span></div>' +
    '</div>'
  ).join("") || '<div class="empty-note">' + (hasTier && hasFlag ? 'ничего не найдено' : 'ничего не выбрано — выберите тир и хотя бы одну галку') + '</div>';
  $("spravList").scrollTop = sc;
}
// ---------- справочник производителей (спека 2026-09-20-фабрики §4.1) ----------
// Список — вспомогательный (спека 2026-09-21 §2.5): клик по карточке выбирает
// узел в дереве на канвасе.
function renderProdSprav() {
  const sc = $("spravList").scrollTop;
  const q = $("spravSearch").value.trim().toLowerCase();
  // Фильтр по правилу видимости+скрытости дерева (спека скрытых §3.5):
  // расовость (prodVisible) + скрытость КАТЕГОРИИ-СЛОТА (галка, catHidden) +
  // узел в дереве («клик не повисает», prodNodeVisible) + поиск (AND).
  const list = state.producer_types.filter(p => {
    if (!prodVisible(p)) return false;                          // расовость (п.1)
    const t = p.parent_id ? state.producer_types.find(x => x.id === p.parent_id) : null;
    const catHidden = !!(t && t.kind === "goods" && prodCatHidden(t, p.category_id));
    if (catHidden && !prodShowHidden) return false;             // скрытость категории (п.2)
    if (!prodNodeVisible(p)) return false;                      // «клик не повисает» (п.3)
    if (q && !p.name.toLowerCase().includes(q)) return false;   // поиск (п.4)
    return true;
  });
  $("spravTitle").textContent = "Производители · " + list.length;
  $("spravList").innerHTML = list.map(p => {
    const t = p.parent_id ? state.producer_types.find(x => x.id === p.parent_id) : null;
    const catHidden = !!(t && t.kind === "goods" && prodCatHidden(t, p.category_id));
    return '<div class="card' + (catHidden ? ' hidden' : '') + '" onclick="prodClick(' + p.id + ')" ondblclick="prodDblClick(' + p.id + ')">' +
    '<div class="nm">' + esc(p.name) + '<button class="info" onclick="event.stopPropagation();openProdPopup(' + p.id + ')" title="деталь (без смены выбора)">ⓘ</button></div>' +
    '<div class="meta">' + esc(kindLabel(p.kind)) + (p.category_name ? ' · ' + esc(p.category_name) : '') +
    (p.parent_name ? ' · ← ' + esc(p.parent_name) : '') +
    ' <span class="badge ' + badgeClass(p.status) + '">' + esc(statusLabel(p.status)) + '</span>' +
    (catHidden ? ' <span class="badge b-hidden" title="категория скрыта на этом уровне расовости">скрыта</span>' : '') + '</div>' +
    '</div>';
  }).join("") || '<div class="empty-note">нет типов производителей</div>';
  $("spravList").scrollTop = sc;
}

function startProdRename() {
  const p = state.producer_types.find(x => x.id === popupGoodId);

  el.innerHTML = '<input id="renameInput" type="text" value="' + esc(p.name) + '" style="width:100%;box-sizing:border-box">';
  const inp = $("renameInput");
  inp.focus(); inp.select();
  inp.addEventListener("keydown", ev => {
    if (ev.key === "Enter") commitProdRename();
    if (ev.key === "Escape") renderProdPopup();

  inp.addEventListener("blur", commitProdRename);
}
async function commitProdRename() {
  const inp = $("renameInput");
  if (!inp) return;
  const name = inp.value.trim();
  if (!name) { renderProdPopup(); return; }

// семейство/раса в попапе (спека §5): каскад — выбор расы фиксирует семейство,
// выбор семейства сбрасывает расу; сохраняется через PUT {race_family, race}.
function popupRaceFamilyChanged() {
  const raceSel = $("popupRaceSel");
  if (raceSel) raceSel.value = "";
  saveProdRace();
}
function popupRaceChanged() {
  const raceSel = $("popupRaceSel");
  const famSel = $("popupRaceFamilySel");
  if (raceSel && famSel && raceSel.value) {
    const fam = raceFamilyOf(raceSel.value);
    if (fam) famSel.value = fam;
  }

async function saveProdRace() {
  const famSel = $("popupRaceFamilySel");
  const raceSel = $("popupRaceSel");
  if (!famSel || !raceSel) return;
  const r = await api("PUT", "/studio/api/producers/" + popupGoodId, {race_family: famSel.value, race: raceSel.value});
  if (r) fetchState();
